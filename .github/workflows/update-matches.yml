name: GOALINS - Update Matches

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:

  update-matches:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # FETCH MATCHES
      # =====================================================

      - name: Fetch football matches
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

        run: |

          python3 <<'PY'

          import json
          import os
          import time

          from datetime import (
              datetime,
              timedelta,
              timezone
          )

          from urllib.request import (
              Request,
              urlopen
          )

          from urllib.parse import urlencode


          # =====================================================
          # CONFIGURATION
          # =====================================================

          API_KEY = os.environ.get(
              "API_FOOTBALL_KEY"
          )

          if not API_KEY:

              raise RuntimeError(
                  "API_FOOTBALL_KEY is missing"
              )


          BASE_URL = (
              "https://v3.football.api-sports.io/fixtures"
          )


          TIMEZONE = "Africa/Algiers"


          # =====================================================
          # IMPORTANT DATE RANGE
          # =====================================================
          #
          # 7 DAYS BEFORE
          # +
          # TODAY
          # +
          # 7 DAYS AFTER
          #
          # This allows the Highlights Engine
          # to find recently finished matches.
          # =====================================================

          DAYS_BEFORE = 7
          DAYS_AFTER = 7


          now_utc = datetime.now(
              timezone.utc
          )


          matches = []


          # =====================================================
          # FETCH ONE DAY
          # =====================================================

          def fetch_day(date_string):

              print(
                  "--------------------------------------"
              )

              print(
                  f"Fetching matches for: {date_string}"
              )


              params = urlencode({

                  "date":
                      date_string,

                  "timezone":
                      TIMEZONE

              })


              url = (
                  f"{BASE_URL}?{params}"
              )


              request = Request(

                  url,

                  headers={

                      "x-apisports-key":
                          API_KEY,

                      "Accept":
                          "application/json"

                  }

              )


              try:

                  with urlopen(
                      request,
                      timeout=45
                  ) as response:

                      raw = response.read()

                      data = json.loads(
                          raw.decode("utf-8")
                      )


              except Exception as error:

                  print(
                      f"ERROR fetching {date_string}:"
                  )

                  print(error)

                  return []


              # -------------------------------------------------
              # API ERRORS
              # -------------------------------------------------

              if data.get("errors"):

                  print(
                      "API-FOOTBALL ERRORS:"
                  )

                  print(
                      json.dumps(
                          data["errors"],
                          ensure_ascii=False
                      )
                  )


              results = data.get(
                  "response",
                  []
              )


              print(
                  f"Matches returned: {len(results)}"
              )


              return results


          # =====================================================
          # DATE LOOP
          # =====================================================

          for day_offset in range(
              -DAYS_BEFORE,
              DAYS_AFTER + 1
          ):

              local_date = (

                  now_utc

                  + timedelta(
                      hours=1
                  )

                  + timedelta(
                      days=day_offset
                  )

              ).date()


              date_string = (
                  local_date.isoformat()
              )


              day_matches = fetch_day(
                  date_string
              )


              matches.extend(
                  day_matches
              )


              # API protection
              time.sleep(1)


          # =====================================================
          # NORMALIZE MATCH DATA
          # =====================================================

          normalized_matches = []


          for item in matches:

              fixture = item.get(
                  "fixture",
                  {}
              )

              league = item.get(
                  "league",
                  {}
              )

              teams = item.get(
                  "teams",
                  {}
              )

              goals = item.get(
                  "goals",
                  {}
              )

              status = fixture.get(
                  "status",
                  {}
              )


              home = teams.get(
                  "home",
                  {}
              )


              away = teams.get(
                  "away",
                  {}
              )


              normalized_matches.append({

                  # -------------------------------------------
                  # FIXTURE
                  # -------------------------------------------

                  "fixture_id":
                      fixture.get("id"),

                  "date":
                      fixture.get("date"),

                  "timestamp":
                      fixture.get("timestamp"),


                  # -------------------------------------------
                  # STATUS
                  # -------------------------------------------

                  "status":
                      status.get("short"),

                  "status_long":
                      status.get("long"),

                  "elapsed":
                      status.get("elapsed"),


                  # -------------------------------------------
                  # LEAGUE
                  # -------------------------------------------

                  "league": {

                      "id":
                          league.get("id"),

                      "name":
                          league.get("name"),

                      "country":
                          league.get("country"),

                      "logo":
                          league.get("logo"),

                      "flag":
                          league.get("flag"),

                      "round":
                          league.get("round")

                  },


                  # -------------------------------------------
                  # HOME
                  # -------------------------------------------

                  "home": {

                      "id":
                          home.get("id"),

                      "name":
                          home.get("name"),

                      "logo":
                          home.get("logo"),

                      "winner":
                          home.get("winner")

                  },


                  # -------------------------------------------
                  # AWAY
                  # -------------------------------------------

                  "away": {

                      "id":
                          away.get("id"),

                      "name":
                          away.get("name"),

                      "logo":
                          away.get("logo"),

                      "winner":
                          away.get("winner")

                  },


                  # -------------------------------------------
                  # GOALS
                  # -------------------------------------------

                  "goals": {

                      "home":
                          goals.get("home"),

                      "away":
                          goals.get("away")

                  }

              })


          # =====================================================
          # REMOVE INVALID FIXTURES
          # =====================================================

          normalized_matches = [

              match

              for match in normalized_matches

              if match.get("fixture_id")

          ]


          # =====================================================
          # REMOVE DUPLICATES
          # =====================================================

          unique_matches = {}


          for match in normalized_matches:

              fixture_id = match.get(
                  "fixture_id"
              )


              unique_matches[
                  fixture_id
              ] = match


          matches = list(
              unique_matches.values()
          )


          # =====================================================
          # SORT BY DATE
          # =====================================================

          matches.sort(

              key=lambda match: (

                  match.get(
                      "timestamp"
                  )
                  or 0

              )

          )


          # =====================================================
          # DIAGNOSTICS
          # =====================================================

          finished_statuses = {
              "FT",
              "AET",
              "PEN"
          }


          finished_matches = [

              match

              for match in matches

              if match.get("status")
              in finished_statuses

          ]


          upcoming_matches = [

              match

              for match in matches

              if match.get("status")
              not in finished_statuses

          ]


          # =====================================================
          # LEAGUE DISTRIBUTION
          # =====================================================

          league_distribution = {}


          for match in matches:

              league = match.get(
                  "league",
                  {}
              )


              league_name = (
                  league.get("name")
                  or "Unknown"
              )


              league_distribution[
                  league_name
              ] = (

                  league_distribution.get(
                      league_name,
                      0
                  )

                  + 1

              )


          # =====================================================
          # FINISHED LEAGUE DISTRIBUTION
          # =====================================================

          finished_distribution = {}


          for match in finished_matches:

              league = match.get(
                  "league",
                  {}
              )


              league_name = (
                  league.get("name")
                  or "Unknown"
              )


              finished_distribution[
                  league_name
              ] = (

                  finished_distribution.get(
                      league_name,
                      0
                  )

                  + 1

              )


          # =====================================================
          # PRINT DIAGNOSTIC
          # =====================================================

          print("")
          print(
              "======================================"
          )

          print(
              "GOALINS MATCHES DIAGNOSTIC"
          )

          print(
              "======================================"
          )

          print(
              f"Total matches: {len(matches)}"
          )

          print(
              f"Finished matches: "
              f"{len(finished_matches)}"
          )

          print(
              f"Upcoming matches: "
              f"{len(upcoming_matches)}"
          )

          print(
              f"Days before: {DAYS_BEFORE}"
          )

          print(
              f"Days after: {DAYS_AFTER}"
          )

          print(
              f"Timezone: {TIMEZONE}"
          )

          print(
              "--------------------------------------"
          )

          print(
              "League distribution:"
          )


          for league_name, count in sorted(
              league_distribution.items()
          ):

              print(
                  f"  {league_name}: {count}"
              )


          print(
              "--------------------------------------"
          )

          print(
              "Finished league distribution:"
          )


          if finished_distribution:

              for league_name, count in sorted(
                  finished_distribution.items()
              ):

                  print(
                      f"  {league_name}: {count}"
                  )

          else:

              print(
                  "  NONE"
              )


          print(
              "--------------------------------------"
          )

          print(
              "Recent finished matches:"
          )


          for match in finished_matches[-20:]:

              league = match.get(
                  "league",
                  {}
              )

              print(

                  f"  "
                  f"{str(match.get('date', ''))[:10]} | "
                  f"{league.get('name', 'Football')} | "
                  f"{match.get('home', {}).get('name', 'Home')} "
                  f"vs "
                  f"{match.get('away', {}).get('name', 'Away')} | "
                  f"{match.get('status', '')}"

              )


          print(
              "======================================"
          )


          # =====================================================
          # OUTPUT
          # =====================================================

          output = {

              "updated_at":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "timezone":
                  TIMEZONE,

              "days_before":
                  DAYS_BEFORE,

              "days_after":
                  DAYS_AFTER,

              "count":
                  len(matches),

              "finished_count":
                  len(finished_matches),

              "matches":
                  matches

          }


          # =====================================================
          # SAVE
          # =====================================================

          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              "data/matches.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(

                  output,

                  file,

                  ensure_ascii=False,

                  indent=2

              )


          print("")
          print(
              f"GOALINS: "
              f"{len(matches)} matches saved."
          )

          print(
              f"Finished: "
              f"{len(finished_matches)}"
          )

          print(
              "======================================"
          )

          PY


      # =====================================================
      # COMMIT
      # =====================================================

      - name: Commit updated matches
        run: |

          git config user.name "GOALINS Bot"

          git config user.email \
            "actions@users.noreply.github.com"


          git add data/matches.json


          if git diff --cached --quiet; then

            echo "No match changes."

            exit 0

          fi


          git commit \
            -m "Update football matches"


          git push
