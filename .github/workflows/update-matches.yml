name: GOALINS - Update Matches

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-matches:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch football matches
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |

          python3 <<'PY'

          import json
          import os
          import time
          from datetime import datetime, timedelta, timezone
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode

          API_KEY = os.environ.get("API_FOOTBALL_KEY")

          if not API_KEY:
              raise RuntimeError("API_FOOTBALL_KEY is missing")

          BASE_URL = "https://v3.football.api-sports.io/fixtures"

          # الجزائر = Africa/Algiers
          # نستخدم UTC+1 بشكل ثابت هنا.
          LOCAL_OFFSET = timedelta(hours=1)

          today_utc = datetime.now(timezone.utc)

          matches = []

          for day_offset in range(7):

              local_date = (
                  today_utc + LOCAL_OFFSET
                  + timedelta(days=day_offset)
              ).date()

              date_string = local_date.isoformat()

              print(f"Fetching: {date_string}")

              query = urlencode({
                  "date": date_string,
                  "timezone": "Africa/Algiers"
              })

              url = f"{BASE_URL}?{query}"

              request = Request(
                  url,
                  headers={
                      "x-apisports-key": API_KEY,
                      "Accept": "application/json"
                  }
              )

              with urlopen(request, timeout=30) as response:

                  data = json.loads(
                      response.read().decode("utf-8")
                  )

              if data.get("errors"):
                  print(
                      "API errors:",
                      data["errors"]
                  )

              for item in data.get("response", []):

                  fixture = item.get("fixture", {})
                  league = item.get("league", {})
                  teams = item.get("teams", {})
                  goals = item.get("goals", {})
                  status = fixture.get("status", {})

                  matches.append({

                      "fixture_id":
                          fixture.get("id"),

                      "date":
                          fixture.get("date"),

                      "timestamp":
                          fixture.get("timestamp"),

                      "status":
                          status.get("short"),

                      "status_long":
                          status.get("long"),

                      "elapsed":
                          status.get("elapsed"),

                      "league": {

                          "id":
                              league.get("id"),

                          "name":
                              league.get("name"),

                          "country":
                              league.get("country"),

                          "logo":
                              league.get("logo"),

                          "flag":
                              league.get("flag"),

                          "round":
                              league.get("round")

                      },

                      "home": {

                          "id":
                              teams.get("home", {}).get("id"),

                          "name":
                              teams.get("home", {}).get("name"),

                          "logo":
                              teams.get("home", {}).get("logo"),

                          "winner":
                              teams.get("home", {}).get("winner")

                      },

                      "away": {

                          "id":
                              teams.get("away", {}).get("id"),

                          "name":
                              teams.get("away", {}).get("name"),

                          "logo":
                              teams.get("away", {}).get("logo"),

                          "winner":
                              teams.get("away", {}).get("winner")

                      },

                      "goals": {

                          "home":
                              goals.get("home"),

                          "away":
                              goals.get("away")

                      }

                  })

              # نتجنب طلبات متتالية بسرعة
              time.sleep(1)


          # ترتيب المباريات حسب وقت البداية
          matches.sort(
              key=lambda x: (
                  x.get("timestamp") or 0
              )
          )


          output = {

              "updated_at":
                  datetime.now(timezone.utc).isoformat(),

              "timezone":
                  "Africa/Algiers",

              "days":
                  7,

              "count":
                  len(matches),

              "matches":
                  matches

          }


          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              "data/matches.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              f"Saved {len(matches)} matches."
          )

          PY


      - name: Commit updated matches
        run: |

          git config user.name "GOALINS Bot"

          git config user.email "actions@users.noreply.github.com"

          git add data/matches.json

          git diff --cached --quiet || \
            git commit -m "Update football matches"

          git push
