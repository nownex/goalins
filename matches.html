<head>

<link rel="stylesheet" href="style.css">


<style>

/* =====================================================
   GOALINS — MATCHES
   ===================================================== */

.matches-page {
    min-height: calc(100vh - 80px);
    padding: 35px 0 70px;
}


/* =====================================================
   TITLE
   ===================================================== */

.page-title {
    margin-bottom: 25px;
}

.page-title small {
    color: var(--accent);
    font-weight: 800;
}

.page-title h1 {
    margin: 6px 0;
    font-size: 32px;
}

.page-title p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
}


/* =====================================================
   DATE BUTTONS
   ===================================================== */

.date-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 12px;
}

.date-btn {
    padding: 13px 8px;

    border: 1px solid var(--border);
    border-radius: 13px;

    background: var(--card);
    color: white;

    font-family: inherit;
    cursor: pointer;
}

.date-btn strong {
    display: block;
}

.date-btn small {
    display: block;
    margin-top: 3px;
    color: var(--muted);
}

.date-btn.active {
    border-color: var(--accent);
    background: rgba(37,211,102,.10);
    color: var(--accent);
}

.date-btn.active small {
    color: var(--accent);
}


/* =====================================================
   DATE PICKER
   ===================================================== */

.date-picker {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
}

.date-picker label {
    color: var(--muted);
    font-size: 13px;
}

.date-picker input {
    flex: 1;

    padding: 12px;

    border: 1px solid var(--border);
    border-radius: 11px;

    background: var(--card);
    color: white;

    font-family: inherit;
}


/* =====================================================
   FILTER
   ===================================================== */

.filter-box {
    margin-bottom: 25px;
}

.filter-box label {
    display: block;

    color: var(--muted);

    font-size: 13px;

    margin-bottom: 7px;
}

.filter-box select {
    width: 100%;

    padding: 13px;

    border: 1px solid var(--border);
    border-radius: 12px;

    background: var(--card);
    color: white;

    font-family: inherit;

    cursor: pointer;
}


/* =====================================================
   INFO
   ===================================================== */

.results-info {
    display: flex;

    justify-content: space-between;
    align-items: center;

    color: var(--muted);

    font-size: 13px;

    margin-bottom: 14px;
}

.results-info strong {
    color: white;
}


/* =====================================================
   MATCH LIST
   ===================================================== */

.matches-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}


/* =====================================================
   LEAGUE BOX
   ===================================================== */

.league-box {
    overflow: hidden;

    background: var(--card);

    border: 1px solid var(--border);
    border-radius: 17px;
}

.league-head {
    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 13px 15px;

    border-bottom: 1px solid var(--border);
}

.league-title {
    display: flex;
    align-items: center;
    gap: 9px;
}

.league-title img {
    width: 30px;
    height: 30px;

    object-fit: contain;
}

.league-name {
    font-size: 14px;
    font-weight: 800;
}

.league-country {
    color: var(--muted);
    font-size: 11px;
}


/* =====================================================
   MATCH
   ===================================================== */

.match {
    display: grid;

    grid-template-columns:
        1fr 90px 1fr;

    align-items: center;

    min-height: 105px;

    padding: 12px 15px;

    border-bottom: 1px solid var(--border);
}

.match:last-child {
    border-bottom: 0;
}


/* =====================================================
   TEAM
   ===================================================== */

.team {
    display: flex;

    align-items: center;

    gap: 9px;

    font-size: 13px;

    font-weight: 800;
}

.team.home {
    justify-content: flex-end;
    text-align: right;
}

.team.away {
    justify-content: flex-start;
    text-align: left;
}

.team img {
    width: 42px;
    height: 42px;

    object-fit: contain;

    flex-shrink: 0;
}


/* =====================================================
   CENTER
   ===================================================== */

.center {
    text-align: center;
}

.time {
    color: var(--accent);

    font-size: 15px;

    font-weight: 900;
}

.score {
    font-size: 19px;

    font-weight: 900;
}

.status {
    margin-top: 4px;

    color: var(--muted);

    font-size: 10px;
}

.live {
    color: #ff5364;
}


/* =====================================================
   STATE
   ===================================================== */

.state {
    min-height: 280px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;

    border:
        1px dashed
        rgba(255,255,255,.13);

    border-radius: 18px;

    padding: 30px;
}

.state-icon {
    font-size: 38px;
    margin-bottom: 12px;
}

.state h2 {
    margin-bottom: 7px;
}

.state p {
    color: var(--muted);

    font-size: 13px;

    line-height: 1.8;
}


/* =====================================================
   LOADER
   ===================================================== */

.loader {
    width: 38px;
    height: 38px;

    border-radius: 50%;

    border:
        3px solid
        rgba(255,255,255,.10);

    border-top-color:
        var(--accent);

    animation:
        spin .8s linear infinite;

    margin-bottom: 15px;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:650px) {

    .matches-page {
        padding: 30px 0 60px;
    }

    .page-title h1 {
        font-size: 28px;
    }

    .date-buttons {
        gap: 7px;
    }

    .date-btn {
        padding: 12px 5px;
        font-size: 12px;
    }

    .match {
        grid-template-columns:
            1fr 60px 1fr;

        padding:
            10px 7px;
    }

    .team {
        font-size: 10px;
        gap: 5px;
    }

    .team img {
        width: 33px;
        height: 33px;
    }

    .time {
        font-size: 12px;
    }

    .score {
        font-size: 16px;
    }

}

</style>

</head>

<script>

/* =====================================================
   GOALINS MATCH ENGINE
   ===================================================== */


/* =====================================================
   ALLOWED LEAGUE IDS
   ===================================================== */

/*
 * مهم جدًا:
 *
 * نعتمد على ID وليس اسم الدوري.
 *
 * لذلك:
 *
 * Premier League England = 39
 *
 * Premier League Kuwait
 * Premier League Kazakhstan
 * وغيرها
 *
 * لن تظهر.
 *
 * كذلك أي دوري نسائي أو درجة ثانية
 * لن يظهر لأنه غير موجود هنا.
 */

const ALLOWED_LEAGUES = {


    /* ================================================
       🇬🇧 ENGLAND
       ================================================ */

    39:
        "premier-league",


    /* ================================================
       🇪🇸 SPAIN
       ================================================ */

    140:
        "la-liga",


    /* ================================================
       🇫🇷 FRANCE
       ================================================ */

    61:
        "ligue-1",


    /* ================================================
       🇮🇹 ITALY
       ================================================ */

    135:
        "serie-a",


    /* ================================================
       🇳🇱 NETHERLANDS
       ================================================ */

    88:
        "eredivisie",


    /* ================================================
       🇧🇪 BELGIUM
       ================================================ */

    144:
        "jupiler",


    /* ================================================
       🇵🇹 PORTUGAL
       ================================================ */

    94:
        "primeira-liga",


    /* ================================================
       🇩🇪 GERMANY
       ================================================ */

    78:
        "bundesliga",


    /* ================================================
       🏆 UEFA CHAMPIONS LEAGUE
       ================================================ */

    2:
        "champions-league",


    /* ================================================
       🏆 UEFA EUROPA LEAGUE
       ================================================ */

    3:
        "europa-league",


    /* ================================================
       🏆 UEFA CONFERENCE LEAGUE
       ================================================ */

    848:
        "conference-league",


    /* ================================================
       🌍 WORLD CUP
       ================================================ */

    1:
        "world-cup",


    /* ================================================
       🇪🇺 EURO
       ================================================ */

    4:
        "euro",


    /* ================================================
       🌍 AFRICA CUP OF NATIONS
       ================================================ */

    6:
        "afcon",


    /* ================================================
       🌎 COPA AMERICA
       ================================================ */

    9:
        "copa-america"

};


/* =====================================================
   ELEMENTS
   ===================================================== */

const matchesList =
    document.getElementById(
        "matchesList"
    );


const count =
    document.getElementById(
        "count"
    );


const dateText =
    document.getElementById(
        "dateText"
    );


const dateInput =
    document.getElementById(
        "date"
    );


const leagueFilter =
    document.getElementById(
        "leagueFilter"
    );


const dateButtons =
    document.querySelectorAll(
        ".date-btn"
    );


let matches = [];


let selectedDate =
    localDate(0);


let selectedLeague =
    "all";


/* =====================================================
   DATE
   ===================================================== */

function localDate(offset = 0) {

    const d =
        new Date();

    d.setDate(
        d.getDate() + offset
    );

    return (

        d.getFullYear() +
        "-" +
        String(
            d.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
            d.getDate()
        ).padStart(2, "0")

    );

}


/* =====================================================
   LOAD MATCHES
   ===================================================== */

async function loadMatches() {

    try {


        const response =
            await fetch(
                "data/matches.json?v=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
         * دعم شكل matches.json الحالي
         */

        if (
            Array.isArray(data)
        ) {

            matches =
                data;

        }

        else if (
            Array.isArray(
                data.matches
            )
        ) {

            matches =
                data.matches;

        }

        else if (
            Array.isArray(
                data.response
            )
        ) {

            matches =
                data.response;

        }

        else {

            matches = [];

        }


        console.log(
            "GOALINS:",
            matches.length,
            "matches loaded"
        );


        render();


    }
    catch(error) {


        console.error(
            "GOALINS ERROR:",
            error
        );


        matchesList.innerHTML = `

            <div class="state">

                <div class="state-icon">
                    ⚠️
                </div>

                <h2>
                    تعذر تحميل المباريات
                </h2>

                <p>
                    تعذر قراءة ملف المباريات.
                    <br>
                    data/matches.json
                </p>

            </div>

        `;

    }

}


/* =====================================================
   GET LEAGUE
   ===================================================== */

function getLeague(match) {

    return (

        match.league ||

        match.competition ||

        {}

    );

}


/* =====================================================
   GET LEAGUE ID
   ===================================================== */

function getLeagueId(match) {

    const league =
        getLeague(match);


    return Number(
        league.id
    );

}


/* =====================================================
   ALLOWED LEAGUE
   ===================================================== */

function allowedLeague(match) {


    const leagueId =
        getLeagueId(match);


    /*
     * إذا لم يكن ID موجودًا
     * في القائمة البيضاء
     *
     * يتم رفض المباراة.
     */

    if (
        !Object.prototype.hasOwnProperty.call(
            ALLOWED_LEAGUES,
            leagueId
        )
    ) {

        return null;

    }


    return ALLOWED_LEAGUES[
        leagueId
    ];

}


/* =====================================================
   MATCH DATE
   ===================================================== */

function matchDate(match) {

    return String(

        match.date ||

        match.fixture?.date ||

        ""

    ).substring(
        0,
        10
    );

}


/* =====================================================
   HOME TEAM
   ===================================================== */

function homeTeam(match) {

    return (

        match.home ||

        match.teams?.home ||

        {}

    );

}


/* =====================================================
   AWAY TEAM
   ===================================================== */

function awayTeam(match) {

    return (

        match.away ||

        match.teams?.away ||

        {}

    );

}


/* =====================================================
   HOME GOALS
   ===================================================== */

function homeGoals(match) {

    return (

        match.goals?.home ??

        match.score?.fulltime?.home ??

        "-"

    );

}


/* =====================================================
   AWAY GOALS
   ===================================================== */

function awayGoals(match) {

    return (

        match.goals?.away ??

        match.score?.fulltime?.away ??

        "-"

    );

}


/* =====================================================
   STATUS
   ===================================================== */

function matchStatus(match) {

    return String(

        match.status ||

        match.fixture?.status?.short ||

        ""

    );

}


/* =====================================================
   TIME
   ===================================================== */

function matchTime(match) {


    const value =

        match.date ||

        match.fixture?.date;


    if (!value) {

        return "--:--";

    }


    const d =
        new Date(value);


    return d.toLocaleTimeString(

        "ar-DZ",

        {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        }

    );

}


/* =====================================================
   FILTER
   ===================================================== */

function getFilteredMatches() {


    /*
     * أول فلتر:
     *
     * التاريخ
     */

    let result =

        matches.filter(
            match =>
                matchDate(match) ===
                selectedDate
        );


    /*
     * ثاني فلتر:
     *
     * القائمة البيضاء
     *
     * هنا يتم استبعاد كل شيء
     * غير موجود في ALLOWED_LEAGUES.
     */

    result =

        result.filter(
            match =>
                allowedLeague(match) !== null
        );


    /*
     * ثالث فلتر:
     *
     * الدوري المختار
     */

    if (
        selectedLeague !== "all"
    ) {

        result =

            result.filter(
                match =>
                    allowedLeague(
                        match
                    ) ===
                    selectedLeague
            );

    }


    return result;

}


/* =====================================================
   RENDER
   ===================================================== */

function render() {


    const result =
        getFilteredMatches();


    count.textContent =
        result.length;


    dateText.textContent =
        "مباريات " +
        formatDate(
            selectedDate
        );


    /*
     * لا توجد مباريات
     */

    if (
        result.length === 0
    ) {


        matchesList.innerHTML = `

            <div class="state">

                <div class="state-icon">
                    ⚽
                </div>

                <h2>
                    لا توجد مباريات
                </h2>

                <p>
                    لا توجد مباريات من
                    البطولات التي اخترناها
                    في هذا التاريخ.
                </p>

            </div>

        `;


        return;

    }


    /*
     * GROUP BY LEAGUE ID
     *
     * مهم:
     * نستخدم ID وليس اسم الدوري.
     */

    const groups = {};


    result.forEach(
        match => {


            const league =
                getLeague(match);


            const leagueId =
                getLeagueId(match);


            const key =
                String(
                    leagueId
                );


            if (
                !groups[key]
            ) {


                groups[key] = {

                    league:
                        league,

                    matches:
                        []

                };

            }


            groups[key]
                .matches
                .push(match);

        }
    );


    matchesList.innerHTML =

        Object.values(groups)

            .map(
                group =>
                    createLeague(
                        group
                    )
            )

            .join("");

}


/* =====================================================
   CREATE LEAGUE
   ===================================================== */

function createLeague(group) {


    const league =
        group.league ||
        {};


    const logo =
        league.logo
        ?
        `

            <img
                src="${safeURL(
                    league.logo
                )}"
                alt=""
                loading="lazy">

        `
        :
        "";


    return `

        <section
            class="league-box">


            <div
                class="league-head">


                <div
                    class="league-title">

                    ${logo}


                    <span
                        class="league-name">

                        ${escapeHTML(
                            league.name ||
                            "بطولة"
                        )}

                    </span>

                </div>


                <span
                    class="league-country">

                    ${escapeHTML(
                        league.country ||
                        ""
                    )}

                </span>


            </div>


            ${group.matches
                .map(
                    createMatch
                )
                .join("")}


        </section>

    `;

}


/* =====================================================
   CREATE MATCH
   ===================================================== */

function createMatch(match) {


    const home =
        homeTeam(match);


    const away =
        awayTeam(match);


    const gameStatus =
        matchStatus(match);


    const liveStatuses = [

        "1H",
        "2H",
        "HT",
        "ET",
        "P",
        "LIVE"

    ];


    const finishedStatuses = [

        "FT",
        "AET",
        "PEN"

    ];


    const live =
        liveStatuses.includes(
            gameStatus
        );


    const finished =
        finishedStatuses.includes(
            gameStatus
        );


    let center;


    /*
     * FINISHED
     */

    if (finished) {


        center = `

            <div
                class="score">

                ${homeGoals(match)}

                -

                ${awayGoals(match)}

            </div>


            <div
                class="status">

                انتهت

            </div>

        `;

    }


    /*
     * LIVE
     */

    else if (live) {


        center = `

            <div
                class="score live">

                🔴

                ${homeGoals(match)}

                -

                ${awayGoals(match)}

            </div>


            <div
                class="status live">

                مباشر

            </div>

        `;

    }


    /*
     * UPCOMING
     */

    else {


        center = `

            <div
                class="time">

                ${matchTime(match)}

            </div>


            <div
                class="status">

                لم تبدأ

            </div>

        `;

    }


    return `

        <div
            class="match">


            <!-- HOME -->

            <div
                class="team home">


                <span>

                    ${escapeHTML(
                        home.name ||
                        "الفريق"
                    )}

                </span>


                ${
                    home.logo
                    ?
                    `

                        <img
                            src="${safeURL(
                                home.logo
                            )}"
                            alt=""
                            loading="lazy">

                    `
                    :
                    ""
                }


            </div>



            <!-- CENTER -->

            <div
                class="center">

                ${center}

            </div>



            <!-- AWAY -->

            <div
                class="team away">


                ${
                    away.logo
                    ?
                    `

                        <img
                            src="${safeURL(
                                away.logo
                            )}"
                            alt=""
                            loading="lazy">

                    `
                    :
                    ""
                }


                <span>

                    ${escapeHTML(
                        away.name ||
                        "الفريق"
                    )}

                </span>


            </div>


        </div>

    `;

}


/* =====================================================
   FORMAT DATE
   ===================================================== */

function formatDate(value) {


    const d =
        new Date(
            value +
            "T12:00:00"
        );


    return d.toLocaleDateString(

        "ar-DZ",

        {
            day: "numeric",
            month: "long"
        }

    );

}


/* =====================================================
   SAFE URL
   ===================================================== */

function safeURL(url) {


    try {


        const u =
            new URL(
                url,
                document.baseURI
            );


        if (
            u.protocol !== "http:" &&
            u.protocol !== "https:"
        ) {

            return "";

        }


        return u.href;


    }
    catch {

        return "";

    }

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value) {


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   DATE BUTTONS
   ===================================================== */

dateButtons.forEach(
    button => {


        button.addEventListener(
            "click",
            () => {


                dateButtons.forEach(
                    btn =>
                        btn.classList
                            .remove(
                                "active"
                            )
                );


                button.classList.add(
                    "active"
                );


                selectedDate =
                    localDate(
                        Number(
                            button
                                .dataset
                                .offset
                        )
                    );


                dateInput.value =
                    "";


                render();

            }
        );

    }
);


/* =====================================================
   CUSTOM DATE
   ===================================================== */

dateInput.addEventListener(
    "change",
    () => {


        if (
            !dateInput.value
        ) {

            return;

        }


        dateButtons.forEach(
            btn =>
                btn.classList
                    .remove(
                        "active"
                    )
        );


        selectedDate =
            dateInput.value;


        render();

    }
);


/* =====================================================
   LEAGUE FILTER
   ===================================================== */

leagueFilter.addEventListener(
    "change",
    () => {


        selectedLeague =
            leagueFilter.value;


        render();

    }
);


/* =====================================================
   MOBILE MENU
   ===================================================== */

const menuBtn =
    document.getElementById(
        "menuBtn"
    );


const nav =
    document.getElementById(
        "nav"
    );


if (
    menuBtn &&
    nav
) {


    menuBtn.addEventListener(
        "click",
        () => {


            const open =
                nav.classList.toggle(
                    "active"
                );


            menuBtn.setAttribute(
                "aria-expanded",
                open
                    ? "true"
                    : "false"
            );

        }
    );

}

loadMatches();
