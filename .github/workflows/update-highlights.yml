name: GOALINS - Update Highlights

on:
  workflow_dispatch:
  schedule:
    - cron: "30 * * * *"

permissions:
  contents: write

jobs:
  update-highlights:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check YouTube API key
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "ERROR: YOUTUBE_API_KEY is missing."
            exit 1
          fi

          echo "YouTube API key detected."

      - name: Update highlights
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/update_highlights.py

      - name: Show highlights result
        run: |
          echo "======================================"

          if [ -f data/highlights.json ]; then

            python - <<'PY'
import json

with open(
    "data/highlights.json",
    "r",
    encoding="utf-8"
) as f:
    data = json.load(f)

print(
    f"Highlights saved: {data.get('count', 0)}"
)

for item in data.get("highlights", [])[:10]:
    print(
        f"- {item.get('home')} vs "
        f"{item.get('away')} | "
        f"{item.get('type')} | "
        f"{item.get('source')}"
    )
PY

          else
            echo "data/highlights.json was not created."
            exit 1
          fi

          echo "======================================"

      - name: Commit highlights
        run: |
          git config user.name "GOALINS Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/highlights.json

          git diff --cached --quiet ||             git commit             -m "Update football highlights"

          git push
