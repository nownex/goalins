name: GOALINS - Update Highlights

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "30 * * * *"

permissions:
  contents: write

jobs:
  update-highlights:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check Highlightly API key
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
        run: |
          if [ -z "$HIGHLIGHTLY_API_KEY" ]; then
            echo "ERROR: HIGHLIGHTLY_API_KEY is missing"
            exit 1
          fi

          echo "Highlightly API key detected"

      - name: Update highlights
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
        run: |
          python scripts/update_highlights.py

      - name: Show result
        run: |
          echo "======================================"
          echo "GOALINS HIGHLIGHTS RESULT"
          echo "======================================"

          if [ -f data/highlights.json ]; then
            python - <<'PY'
import json

with open("data/highlights.json", "r", encoding="utf-8") as f:
    data = json.load(f)

print("Highlights saved:", data.get("count", 0))

for item in data.get("highlights", [])[:10]:
    print(
        "-",
        item.get("home"),
        "vs",
        item.get("away"),
        "|",
        item.get("type"),
        "|",
        item.get("source")
    )
PY
          else
            echo "ERROR: data/highlights.json was not created"
            exit 1
          fi

          echo "======================================"

      - name: Commit highlights
        run: |
          git config user.name "GOALINS Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/highlights.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update football highlights"
            git push
          fi
