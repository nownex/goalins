name: GOALINS - Update Highlights

on:
  workflow_dispatch:

  schedule:
    - cron: "30 * * * *"

permissions:
  contents: write

jobs:

  update-highlights:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check secrets
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "ERROR: YOUTUBE_API_KEY is missing"
            exit 1
          fi

          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "ERROR: API_FOOTBALL_KEY is missing"
            exit 1
          fi

          echo "Both API secrets are available."

      - name: Update highlights
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python scripts/update_highlights.py

      - name: Show highlights result
        run: |
          echo "======================================"
          echo "GOALINS HIGHLIGHTS OUTPUT"
          echo "======================================"

          if [ -f data/highlights.json ]; then
            python - <<'PY'
          import json

          with open(
              "data/highlights.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              f"Highlights count: {data.get('count', 0)}"
          )

          for item in data.get("highlights", []):
              print(
                  f"- {item.get('date', '')} | "
                  f"{item.get('home', '')} vs "
                  f"{item.get('away', '')} | "
                  f"{item.get('title', '')}"
              )
          PY
          else
            echo "ERROR: data/highlights.json was not created."
            exit 1
          fi

      - name: Commit highlights
        run: |

          git config user.name "GOALINS Bot"

          git config user.email \
            "goalins-bot@users.noreply.github.com"

          git add data/highlights.json

          if git diff --cached --quiet; then
            echo "No highlight changes."
            exit 0
          fi

          git commit -m "Update football highlights"

          git push
