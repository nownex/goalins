<style>

/* =====================================================
   GOALINS — MATCHES
   ===================================================== */

.matches-page {

    padding: 35px 0 70px;

    min-height:
        calc(100vh - 80px);

}


/* =====================================================
   HEADER
   ===================================================== */

.page-title {

    margin-bottom: 25px;

}


.page-title small {

    color: var(--accent);

    font-weight: 800;

}


.page-title h1 {

    margin: 6px 0;

    font-size: 32px;

}


.page-title p {

    margin: 0;

    color: var(--muted);

    font-size: 14px;

}


/* =====================================================
   DATE FILTER
   ===================================================== */

.date-buttons {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    margin-bottom: 12px;

}


.date-btn {

    border:
        1px solid var(--border);

    background:
        var(--card);

    color: white;

    border-radius: 13px;

    padding: 13px 8px;

    font-family: inherit;

    cursor: pointer;

}


.date-btn strong {

    display: block;

}


.date-btn small {

    display: block;

    margin-top: 3px;

    color: var(--muted);

}


.date-btn.active {

    border-color:
        var(--accent);

    background:
        rgba(37,211,102,.10);

    color:
        var(--accent);

}


.date-btn.active small {

    color:
        var(--accent);

}


/* =====================================================
   DATE INPUT
   ===================================================== */

.date-picker {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 18px;

}


.date-picker label {

    color: var(--muted);

    font-size: 13px;

}


.date-picker input {

    flex: 1;

    padding: 12px;

    border:
        1px solid var(--border);

    border-radius: 11px;

    background:
        var(--card);

    color: white;

    font-family: inherit;

}


/* =====================================================
   LEAGUE FILTER
   ===================================================== */

.filter-box {

    margin-bottom: 25px;

}


.filter-box label {

    display: block;

    color: var(--muted);

    font-size: 13px;

    margin-bottom: 7px;

}


.filter-box select {

    width: 100%;

    padding: 13px;

    border:
        1px solid var(--border);

    border-radius: 12px;

    background:
        var(--card);

    color: white;

    font-family: inherit;

}


/* =====================================================
   RESULTS INFO
   ===================================================== */

.results-info {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    color: var(--muted);

    font-size: 13px;

    margin-bottom: 14px;

}


.results-info strong {

    color: white;

}


/* =====================================================
   MATCH LIST
   ===================================================== */

.matches-list {

    display: flex;

    flex-direction: column;

    gap: 12px;

}


/* =====================================================
   LEAGUE
   ===================================================== */

.league-box {

    overflow: hidden;

    background:
        var(--card);

    border:
        1px solid var(--border);

    border-radius: 17px;

}


.league-head {

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    padding: 13px 15px;

    border-bottom:
        1px solid var(--border);

}


.league-title {

    display: flex;

    align-items: center;

    gap: 9px;

}


.league-title img {

    width: 30px;

    height: 30px;

    object-fit: contain;

}


.league-name {

    font-weight: 800;

    font-size: 14px;

}


.league-country {

    color: var(--muted);

    font-size: 11px;

}


/* =====================================================
   MATCH
   ===================================================== */

.match {

    display: grid;

    grid-template-columns:
        1fr 90px 1fr;

    align-items: center;

    min-height: 105px;

    padding: 12px 15px;

    border-bottom:
        1px solid var(--border);

}


.match:last-child {

    border-bottom: 0;

}


/* =====================================================
   TEAM
   ===================================================== */

.team {

    display: flex;

    align-items: center;

    gap: 9px;

    font-size: 13px;

    font-weight: 800;

}


.team.home {

    justify-content:
        flex-end;

    text-align: right;

}


.team.away {

    justify-content:
        flex-start;

    text-align: left;

}


.team img {

    width: 42px;

    height: 42px;

    object-fit: contain;

    flex-shrink: 0;

}


/* =====================================================
   CENTER
   ===================================================== */

.center {

    text-align: center;

}


.time {

    color:
        var(--accent);

    font-size: 15px;

    font-weight: 900;

}


.score {

    font-size: 19px;

    font-weight: 900;

}


.status {

    margin-top: 4px;

    color: var(--muted);

    font-size: 10px;

}


.live {

    color: #ff5364;

}


/* =====================================================
   EMPTY / LOADING
   ===================================================== */

.state {

    min-height: 280px;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    text-align: center;

    border:
        1px dashed
        rgba(255,255,255,.13);

    border-radius: 18px;

    padding: 30px;

}


.state-icon {

    font-size: 38px;

    margin-bottom: 12px;

}


.state h2 {

    margin-bottom: 7px;

}


.state p {

    color: var(--muted);

    font-size: 13px;

    line-height: 1.8;

}


.loader {

    width: 38px;

    height: 38px;

    border-radius: 50%;

    border:
        3px solid
        rgba(255,255,255,.10);

    border-top-color:
        var(--accent);

    animation:
        spin .8s linear infinite;

    margin-bottom: 15px;

}


@keyframes spin {

    to {

        transform:
            rotate(360deg);

    }

}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:650px) {

    .matches-page {

        padding:
            30px 0 60px;

    }


    .page-title h1 {

        font-size: 28px;

    }


    .date-buttons {

        gap: 7px;

    }


    .date-btn {

        padding:
            12px 5px;

        font-size: 12px;

    }


    .match {

        grid-template-columns:
            1fr 60px 1fr;

        padding:
            10px 7px;

    }


    .team {

        font-size: 10px;

        gap: 5px;

    }


    .team img {

        width: 33px;

        height: 33px;

    }


    .time {

        font-size: 12px;

    }


    .score {

        font-size: 16px;

    }

}

</style>

</head>

<script>

/* =====================================================
   GOALINS MATCHES ENGINE
   ===================================================== */


/* =====================================================
   ELEMENTS
   ===================================================== */

const matchesList =
    document.getElementById(
        "matchesList"
    );


const count =
    document.getElementById(
        "count"
    );


const dateText =
    document.getElementById(
        "dateText"
    );


const dateInput =
    document.getElementById(
        "date"
    );


const leagueFilter =
    document.getElementById(
        "leagueFilter"
    );


const dateButtons =
    document.querySelectorAll(
        ".date-btn"
    );


let matches = [];


let selectedDate =
    localDate(0);


let selectedLeague =
    "all";


/* =====================================================
   DATE
   ===================================================== */

function localDate(offset = 0) {

    const d =
        new Date();


    d.setDate(
        d.getDate() + offset
    );


    return (

        d.getFullYear() +

        "-" +

        String(
            d.getMonth() + 1
        ).padStart(2, "0") +

        "-" +

        String(
            d.getDate()
        ).padStart(2, "0")

    );

}


/* =====================================================
   LOAD JSON
   ===================================================== */

async function loadMatches() {

    try {


        const response =
            await fetch(
                "data/matches.json?v=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if (
            Array.isArray(data)
        ) {

            matches = data;

        }

        else if (
            Array.isArray(
                data.matches
            )
        ) {

            matches =
                data.matches;

        }

        else if (
            Array.isArray(
                data.response
            )
        ) {

            matches =
                data.response;

        }

        else {

            matches = [];

        }


        console.log(
            "GOALINS:",
            matches.length,
            "matches loaded"
        );


        render();


    }

    catch(error) {

        console.error(
            "GOALINS ERROR:",
            error
        );


        matchesList.innerHTML = `

<div class="state">

<div class="state-icon">
⚠️
</div>

<h2>
تعذر تحميل المباريات
</h2>

<p>
تعذر قراءة ملف المباريات.
<br>
data/matches.json
</p>

</div>

`;

    }

}


/* =====================================================
   GET LEAGUE
   ===================================================== */

function getLeague(match) {

    return (

        match.league ||

        match.competition ||

        {}

    );

}


/* =====================================================
   LEAGUE NAME
   ===================================================== */

function leagueName(match) {

    return String(

        getLeague(match).name ||

        ""

    ).toLowerCase();

}


/* =====================================================
   ONLY MAIN LEAGUES
   ===================================================== */

function allowedLeague(match) {


    const name =
        leagueName(match);


    /*
     * =================================================
     * ENGLAND
     * =================================================
     */

    if (
        name ===
            "premier league"
    ) {

        return "premier-league";

    }


    /*
     * =================================================
     * FRANCE
     * =================================================
     */

    if (
        name ===
            "ligue 1"
    ) {

        return "ligue-1";

    }


    /*
     * =================================================
     * SPAIN
     * =================================================
     */

    if (
        name ===
            "la liga"
    ) {

        return "la-liga";

    }


    if (
        name.includes(
            "laliga"
        )
    ) {

        return "la-liga";

    }


    /*
     * =================================================
     * ITALY
     * =================================================
     */

    if (
        name ===
            "serie a"
    ) {

        return "serie-a";

    }


    /*
     * =================================================
     * GERMANY
     * =================================================
     */

    if (
        name ===
            "bundesliga"
    ) {

        return "bundesliga";

    }


    /*
     * =================================================
     * PORTUGAL
     * =================================================
     */

    if (
        name ===
            "primeira liga"
    ) {

        return "primeira-liga";

    }


    if (
        name.includes(
            "liga portugal"
        )
    ) {

        return "primeira-liga";

    }


    /*
     * =================================================
     * NETHERLANDS
     * =================================================
     */

    if (
        name ===
            "eredivisie"
    ) {

        return "eredivisie";

    }


    /*
     * =================================================
     * BELGIUM
     * =================================================
     */

    if (
        name.includes(
            "jupiler pro league"
        )
    ) {

        return "jupiler";

    }


    if (
        name ===
            "pro league"
    ) {

        return "jupiler";

    }


    /*
     * =================================================
     * TURKEY
     * =================================================
     */

    if (
        name.includes(
            "super lig"
        )
    ) {

        return "super-lig";

    }


    if (
        name.includes(
            "süper lig"
        )
    ) {

        return "super-lig";

    }


    /*
     * =================================================
     * GREECE
     * =================================================
     */

    if (
        name.includes(
            "super league"
        ) &&
        !name.includes(
            "champions"
        )
    ) {

        return "super-league-greece";

    }


    /*
     * =================================================
     * SAUDI ARABIA
     * =================================================
     */

    if (
        name.includes(
            "saudi pro league"
        )
    ) {

        return "saudi-pro";

    }


    if (
        name.includes(
            "professional league"
        ) &&
        getLeague(match)
            .country ===
            "Saudi-Arabia"
    ) {

        return "saudi-pro";

    }


    /*
     * =================================================
     * UAE
     * =================================================
     */

    if (
        name.includes(
            "uae pro league"
        )
    ) {

        return "uae-pro";

    }


    if (
        name.includes(
            "pro league"
        ) &&
        getLeague(match)
            .country ===
            "United-Arab-Emirates"
    ) {

        return "uae-pro";

    }


    /*
     * =================================================
     * CHAMPIONS LEAGUE
     * =================================================
     */

    if (
        name.includes(
            "uefa champions league"
        ) ||
        name ===
            "champions league"
    ) {

        return "champions-league";

    }


    /*
     * =================================================
     * EUROPA LEAGUE
     * =================================================
     */

    if (
        name.includes(
            "uefa europa league"
        ) ||
        name ===
            "europa league"
    ) {

        return "europa-league";

    }


    /*
     * =================================================
     * CONFERENCE LEAGUE
     * =================================================
     */

    if (
        name.includes(
            "conference league"
        )
    ) {

        return "conference-league";

    }


    /*
     * =================================================
     * WORLD CUP
     * =================================================
     */

    if (
        name.includes(
            "world cup"
        )
    ) {

        return "world-cup";

    }


    /*
     * أي بطولة أخرى:
     * ممنوعة.
     */

    return null;

}


/* =====================================================
   MATCH DATE
   ===================================================== */

function matchDate(match) {

    return String(

        match.date ||

        match.fixture?.date ||

        ""

    ).substring(
        0,
        10
    );

}


/* =====================================================
   HOME
   ===================================================== */

function homeTeam(match) {

    return (

        match.home ||

        match.teams?.home ||

        {}

    );

}


/* =====================================================
   AWAY
   ===================================================== */

function awayTeam(match) {

    return (

        match.away ||

        match.teams?.away ||

        {}

    );

}


/* =====================================================
   GOALS
   ===================================================== */

function homeGoals(match) {

    return (

        match.goals?.home ??

        match.score?.fulltime?.home ??

        "-"

    );

}


function awayGoals(match) {

    return (

        match.goals?.away ??

        match.score?.fulltime?.away ??

        "-"

    );

}


/* =====================================================
   STATUS
   ===================================================== */

function status(match) {

    return String(

        match.status ||

        match.fixture?.status?.short ||

        ""

    );

}


/* =====================================================
   TIME
   ===================================================== */

function matchTime(match) {

    const value =

        match.date ||

        match.fixture?.date;


    if (!value) {

        return "--:--";

    }


    const d =
        new Date(value);


    return d.toLocaleTimeString(
        "ar-DZ",
        {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        }
    );

}


/* =====================================================
   FILTER
   ===================================================== */

function filteredMatches() {


    let result =

        matches.filter(
            match =>
                matchDate(match) ===
                selectedDate
        );


    /*
     * الدرجة الأولى والمسابقات الكبرى فقط
     */

    result =

        result.filter(
            match =>
                allowedLeague(match)
        );


    /*
     * فلتر المستخدم
     */

    if (
        selectedLeague !==
        "all"
    ) {

        result =

            result.filter(
                match =>
                    allowedLeague(
                        match
                    ) ===
                    selectedLeague
            );

    }


    return result;

}


/* =====================================================
   RENDER
   ===================================================== */

function render() {


    const result =
        filteredMatches();


    count.textContent =
        result.length;


    dateText.textContent =
        "مباريات " +
        formatDate(
            selectedDate
        );


    if (
        result.length === 0
    ) {

        matchesList.innerHTML = `

<div class="state">

<div class="state-icon">
⚽
</div>

<h2>
لا توجد مباريات
</h2>

<p>
لا توجد مباريات من البطولات
الرئيسية في هذا التاريخ.
</p>

</div>

`;

        return;

    }


    /*
     * GROUP BY LEAGUE
     */

    const groups = {};


    result.forEach(
        match => {


            const league =
                getLeague(match);


            const key =
                league.id ||
                league.name ||
                "other";


            if (
                !groups[key]
            ) {

                groups[key] = {

                    league:
                        league,

                    matches:
                        []

                };

            }


            groups[key]
                .matches
                .push(match);

        }
    );


    matchesList.innerHTML =

        Object.values(groups)
            .map(
                group =>
                    createLeague(
                        group
                    )
            )
            .join("");

}


/* =====================================================
   CREATE LEAGUE
   ===================================================== */

function createLeague(group) {


    const league =
        group.league ||
        {};


    const logo =
        league.logo
        ?
        `

<img
    src="${safeURL(
        league.logo
    )}"
    alt=""
    loading="lazy">

`
        :
        "";


    return `

<section class="league-box">


<div class="league-head">


<div class="league-title">

${logo}


<span class="league-name">

${escapeHTML(
    league.name ||
    "بطولة"
)}

</span>

</div>


<span class="league-country">

${escapeHTML(
    league.country ||
    ""
)}

</span>


</div>


${group.matches
    .map(
        createMatch
    )
    .join("")}


</section>

`;

}


/* =====================================================
   CREATE MATCH
   ===================================================== */

function createMatch(match) {


    const home =
        homeTeam(match);


    const away =
        awayTeam(match);


    const gameStatus =
        status(match);


    const live =
        [
            "1H",
            "2H",
            "HT",
            "ET",
            "P",
            "LIVE"
        ].includes(
            gameStatus
        );


    const finished =
        [
            "FT",
            "AET",
            "PEN"
        ].includes(
            gameStatus
        );


    let center = "";


    if (finished) {


        center = `

<div class="score">

${homeGoals(match)}

-

${awayGoals(match)}

</div>

<div class="status">
انتهت
</div>

`;

    }


    else if (live) {


        center = `

<div class="score live">

🔴

${homeGoals(match)}

-

${awayGoals(match)}

</div>

<div class="status live">
مباشر
</div>

`;

    }


    else {


        center = `

<div class="time">

${matchTime(match)}

</div>

<div class="status">
لم تبدأ
</div>

`;

    }


    return `

<div class="match">


<div class="team home">


<span>

${escapeHTML(
    home.name ||
    "الفريق"
)}

</span>


${
home.logo
?
`

<img
    src="${safeURL(
        home.logo
    )}"
    alt=""
    loading="lazy">

`
:
""
}


</div>



<div class="center">

${center}

</div>



<div class="team away">


${
away.logo
?
`

<img
    src="${safeURL(
        away.logo
    )}"
    alt=""
    loading="lazy">

`
:
""
}


<span>

${escapeHTML(
    away.name ||
    "الفريق"
)}

</span>


</div>


</div>

`;

}


/* =====================================================
   DATE FORMAT
   ===================================================== */

function formatDate(value) {


    const d =
        new Date(
            value +
            "T12:00:00"
        );


    return d.toLocaleDateString(
        "ar-DZ",
        {
            day:
                "numeric",
            month:
                "long"
        }
    );

}


/* =====================================================
   SAFE URL
   ===================================================== */

function safeURL(url) {


    try {


        const u =
            new URL(
                url,
                document.baseURI
            );


        if (
            u.protocol !==
                "http:" &&
            u.protocol !==
                "https:"
        ) {

            return "";

        }


        return u.href;


    }

    catch {

        return "";

    }

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value) {


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   DATE BUTTONS
   ===================================================== */

dateButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {


                dateButtons.forEach(
                    btn =>
                        btn.classList
                            .remove(
                                "active"
                            )
                );


                button.classList.add(
                    "active"
                );


                selectedDate =
                    localDate(
                        Number(
                            button
                                .dataset
                                .offset
                        )
                    );


                dateInput.value = "";


                render();

            }
        );

    }
);


/* =====================================================
   CUSTOM DATE
   ===================================================== */

dateInput.addEventListener(
    "change",
    () => {


        if (
            !dateInput.value
        ) {

            return;

        }


        dateButtons.forEach(
            btn =>
                btn.classList
                    .remove(
                        "active"
                    )
        );


        selectedDate =
            dateInput.value;


        render();

    }
);

leagueFilter.addEventListener(

    () => {

        selectedLeague =

);
