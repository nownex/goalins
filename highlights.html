/* =====================================================

const LEAGUE_NAMES = {

    "egyptian premier league":

    "saudi pro league":
        "🇸🇦 الدوري السعودي"

};


/* =====================================================
   NORMALIZE
   ===================================================== */

function normalizeLeagueText(value) {

    return String(value || "")
        .toLowerCase()
        .trim()
        .replace(/\s+/g, " ");

}


/* =====================================================
   CLEAN ROUND / STAGE
   ===================================================== */

function cleanLeagueName(value) {

    let league =
        normalizeLeagueText(value);


    /*
     * الدوري التركي - الجولة 2
     * ↓
     * الدوري التركي
     */

    league =
        league.replace(
            /\s*[-|–—]\s*الجولة\s+\d+/gi,
            ""
        );


    league =
        league.replace(
            /\s*الجولة\s+\d+/gi,
            ""
        );


    /*
     * English rounds
     */

    league =
        league.replace(
            /\s*[-|–—]\s*round\s+\d+/gi,
            ""
        );


    league =
        league.replace(
            /\s*round\s+\d+/gi,
            ""
        );


    return league
        .replace(/\s+/g, " ")
        .trim();

}


/* =====================================================
   GET LEAGUE KEY
   ===================================================== */

function getLeagueKey(league) {

    const cleaned =
        cleanLeagueName(
            league
        );


    /*
     * Arabic leagues
     */

    const arabicMap = {

        "الدوري الإنجليزي":
            "premier-league",

        "الدوري الإسباني":
            "la-liga",

        "الدوري الفرنسي":
            "ligue-1",

        "الدوري الإيطالي":
            "serie-a",

        "الدوري الهولندي":
            "eredivisie",

        "الدوري البلجيكي":
            "jupiler-pro-league",

        "الدوري البرتغالي":
            "primeira-liga",

        "الدوري الألماني":
            "bundesliga",

        "دوري أبطال أوروبا":
            "champions-league",

        "الدوري الأوروبي":
            "europa-league",

        "دوري المؤتمر الأوروبي":
            "conference-league",

        "الدوري التركي":
            "turkish-super-league",

        "الدوري المصري":
            "egyptian-premier-league",

        "الدوري السعودي":
            "saudi-pro-league"

    };


    if (
        arabicMap[cleaned]
    ) {

        return arabicMap[
            cleaned
        ];

    }


    /*
     * English leagues
     */

    const englishMap = {

        "premier league":
            "premier-league",

        "english premier league":
            "premier-league",

        "la liga":
            "la-liga",

        "laliga":
            "la-liga",

        "spanish la liga":
            "la-liga",

        "ligue 1":
            "ligue-1",

        "serie a":
            "serie-a",

        "eredivisie":
            "eredivisie",

        "jupiler pro league":
            "jupiler-pro-league",

        "primeira liga":
            "primeira-liga",

        "bundesliga":
            "bundesliga",

        "uefa champions league":
            "champions-league",

        "champions league":
            "champions-league",

        "uefa europa league":
            "europa-league",

        "europa league":
            "europa-league",

        "uefa europa conference league":
            "conference-league",

        "europa conference league":
            "conference-league",

        "turkish super league":
            "turkish-super-league",

        "super lig":
            "turkish-super-league",

        "super league":
            "turkish-super-league",

        "egyptian premier league":
            "egyptian-premier-league",

        "saudi pro league":
            "saudi-pro-league"

    };


    if (
        englishMap[cleaned]
    ) {

        return englishMap[
            cleaned
        ];

    }


    /*
     * New / unknown league
     */

    return cleaned
        .replace(
            /[^a-z0-9\u0600-\u06ff]+/gi,
            "-"
        )
        .replace(
            /^-+|-+$/g,
            ""
        );

}


/* =====================================================
   GET LEAGUE DISPLAY NAME
   ===================================================== */

function getLeagueLabel(league) {

    const cleaned =
        cleanLeagueName(
            league
        );


    /*
     * Arabic
     */

    const arabicLabels = {

        "الدوري الإنجليزي":
            "🇬🇧 الدوري الإنجليزي",

        "الدوري الإسباني":
            "🇪🇸 الدوري الإسباني",

        "الدوري الفرنسي":
            "🇫🇷 الدوري الفرنسي",

        "الدوري الإيطالي":
            "🇮🇹 الدوري الإيطالي",

        "الدوري الهولندي":
            "🇳🇱 الدوري الهولندي",

        "الدوري البلجيكي":
            "🇧🇪 الدوري البلجيكي",

        "الدوري البرتغالي":
            "🇵🇹 الدوري البرتغالي",

        "الدوري الألماني":
            "🇩🇪 الدوري الألماني",

        "دوري أبطال أوروبا":
            "🏆 دوري أبطال أوروبا",

        "الدوري الأوروبي":
            "🏆 الدوري الأوروبي",

        "دوري المؤتمر الأوروبي":
            "🏆 دوري المؤتمر الأوروبي",

        "الدوري التركي":
            "🇹🇷 الدوري التركي",

        "الدوري المصري":
            "🇪🇬 الدوري المصري",

        "الدوري السعودي":
            "🇸🇦 الدوري السعودي"

    };


    if (
        arabicLabels[cleaned]
    ) {

        return arabicLabels[
            cleaned
        ];

    }


    /*
     * English
     */

    if (
        LEAGUE_NAMES[cleaned]
    ) {

        return LEAGUE_NAMES[
            cleaned
        ];

    }


    /*
     * Unknown league
     */

    return cleanLeagueName(
        league
    );

}


/* =====================================================
   BUILD LEAGUE FILTER
   ===================================================== */

function buildLeagueFilter() {

    const leagues =
        new Map();


    videos.forEach(
        video => {

            const league =
                String(
                    video.league || ""
                ).trim();


            if (!league) {
                return;
            }


            const key =
                getLeagueKey(
                    league
                );


            if (!key) {
                return;
            }


            if (
                !leagues.has(key)
            ) {

                leagues.set(
                    key,
                    league
                );

            }

        }
    );


    const sorted =
        Array.from(
            leagues.entries()
        )
        .sort(
            (
                a,
                b
            ) => {

                return getLeagueLabel(
                    a[1]
                ).localeCompare(
                    getLeagueLabel(
                        b[1]
                    ),
                    "ar"
                );

            }
        );


    leagueFilter.innerHTML = `

        <option value="all">
            جميع البطولات
        </option>

    `;


    sorted.forEach(
        (
            [key, original]
        ) => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                key;


            option.textContent =
                getLeagueLabel(
                    original
                );


            leagueFilter.appendChild(
                option
            );

        }
    );


    console.log(
        "GOALINS leagues:",
        sorted
    );

}


/* =====================================================
   DATE — ALGERIA
   ===================================================== */

function getAlgeriaDate() {

    const formatter =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone:
                    "Africa/Algiers",

                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit"
            }
        );


    return formatter.format(
        new Date()
    );

}


function getToday() {

    return getAlgeriaDate();

}


function getYesterday() {

    const date =
        new Date();


    date.setDate(
        date.getDate() - 1
    );


    const formatter =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone:
                    "Africa/Algiers",

                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit"
            }
        );


    return formatter.format(
        date
    );

}


/* =====================================================
   DATE MATCH
   ===================================================== */

function dateMatches(
    videoDate,
    selectedDate
) {

    if (
        selectedDate === "all"
    ) {

        return true;

    }


    const value =
        String(
            videoDate || ""
        )
        .slice(
            0,
            10
        );


    if (
        selectedDate === "today"
    ) {

        return (
            value ===
            getToday()
        );

    }


    if (
        selectedDate === "yesterday"
    ) {

        return (
            value ===
            getYesterday()
        );

    }


    return true;

}


/* =====================================================
   LEAGUE MATCH
   ===================================================== */

function leagueMatches(
    videoLeague,
    selectedLeague
) {

    if (
        selectedLeague === "all"
    ) {

        return true;

    }


    return (
        getLeagueKey(
            videoLeague
        )
        ===
        selectedLeague
    );

}


/* =====================================================
   LOAD VIDEOS
   ===================================================== */

async function loadVideos() {

    try {

        const response =
            await fetch(
                "data/highlights.json?v="
                +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Could not load highlights.json"
            );

        }


        const data =
            await response.json();


        videos =
            Array.isArray(
                data.highlights
            )
            ?
            data.highlights
            :
            [];


        /*
         * Build dynamic league filter
         */

        buildLeagueFilter();


        /*
         * Render cards
         */

        renderVideos();

    }

    catch (error) {

        console.error(
            "GOALINS:",
            error
        );


        videoCount.textContent =
            "0 فيديو";


        videoGrid.innerHTML = `

            <div class="state">

                <div class="state-icon">
                    ⚠️
                </div>

                <h2>
                    تعذر تحميل الملخصات
                </h2>

                <p>
                    حاول تحديث الصفحة بعد قليل.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   FILTERED VIDEOS
   ===================================================== */

function getFilteredVideos() {

    const dateValue =
        dateFilter.value;


    const leagueValue =
        leagueFilter.value;


    return videos.filter(
        video => {

            /*
             * DATE
             */

            if (
                !dateMatches(
                    video.date,
                    dateValue
                )
            ) {

                return false;

            }


            /*
             * LEAGUE
             */

            if (
                !leagueMatches(
                    video.league,
                    leagueValue
                )
            ) {

                return false;

            }


            return true;

        }
    );

}


/* =====================================================
   RENDER
   ===================================================== */

function renderVideos() {

    const filtered =
        getFilteredVideos();


    videoCount.textContent =
        filtered.length
        +
        " فيديو";


    if (
        filtered.length === 0
    ) {

        videoGrid.innerHTML = `

            <div class="state">

                <div class="state-icon">
                    🎬
                </div>

                <h2>
                    لا توجد ملخصات
                </h2>

                <p>
                    لا توجد فيديوهات مطابقة
                    للفلاتر الحالية.
                </p>

            </div>

        `;

        return;

    }


    videoGrid.innerHTML =
        filtered
            .map(
                (
                    video,
                    index
                ) => {

                    return createVideoCard(
                        video,
                        index
                    );

                }
            )
            .join("");


    /*
     * Card click
     */

    document
        .querySelectorAll(
            ".video-card"
        )
        .forEach(
            (
                card,
                index
            ) => {

                card.addEventListener(
                    "click",
                    () => {

                        openVideo(
                            filtered[index]
                        );

                    }
                );

            }
        );

}


/* =====================================================
   CREATE VIDEO CARD
   ===================================================== */

function createVideoCard(
    video,
    index
) {

    const title =
        escapeHtml(
            video.title
            ||
            (
                video.home
                +
                " vs "
                +
                video.away
            )
        );


    const thumbnail =
        escapeAttribute(
            video.thumbnail
            ||
            ""
        );


    const league =
        escapeHtml(
            getLeagueLabel(
                video.league
                ||
                ""
            )
        );


    const date =
        escapeHtml(
            String(
                video.date || ""
            ).slice(
                0,
                10
            )
        );


    const source =
        escapeHtml(
            video.source
            ||
            "YouTube"
        );


    return `

        <article
            class="video-card"
            data-index="${index}">


            <div class="thumbnail">

                ${
                    thumbnail

                    ?

                    `

                    <img
                        src="${thumbnail}"
                        alt="${title}"
                        loading="lazy">

                    `

                    :

                    `

                    <div
                        style="
                        width:100%;
                        height:100%;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-size:55px;
                        ">

                        ⚽

                    </div>

                    `
                }


                <div class="play">
                    ▶
                </div>

            </div>


            <div class="video-content">

                <h3 class="video-title">
                    ${title}
                </h3>


                <div class="video-meta">

                    <span class="video-league">
                        ${league}
                    </span>

                    <span>
                        ${date}
                    </span>

                </div>


                <div class="video-source">

                    المصدر:
                    ${source}

                </div>

            </div>


        </article>

    `;

}


/* =====================================================
   OPEN YOUTUBE
   ===================================================== */

function openVideo(
    video
) {

    let youtubeUrl =
        String(
            video.url || ""
        ).trim();


    /*
     * 1 — Normal YouTube URL
     */

    if (
        !youtubeUrl
        &&
        video.youtube_id
    ) {

        youtubeUrl =
            "https://www.youtube.com/watch?v="
            +
            encodeURIComponent(
                video.youtube_id
            );

    }


    /*
     * 2 — Convert embed_url
     */

    if (
        !youtubeUrl
        &&
        video.embed_url
    ) {

        const match =
            String(
                video.embed_url
            )
            .match(
                /embed\/([^?&#/]+)/
            );


        if (match) {

            youtubeUrl =
                "https://www.youtube.com/watch?v="
                +
                encodeURIComponent(
                    match[1]
                );

        }

    }


    /*
     * 3 — Convert embed
     */

    if (
        !youtubeUrl
        &&
        video.embed
    ) {

        const match =
            String(
                video.embed
            )
            .match(
                /embed\/([^?&#/]+)/
            );


        if (match) {

            youtubeUrl =
                "https://www.youtube.com/watch?v="
                +
                encodeURIComponent(
                    match[1]
                );

        }

    }


    /*
     * No URL
     */

    if (!youtubeUrl) {

        console.warn(
            "GOALINS: No YouTube URL",
            video
        );

        return;

    }


    /*
     * IMPORTANT:
     *
     * Never open embed URL.
     * Always open normal YouTube URL.
     */

    window.location.href =
        youtubeUrl;

}


/* =====================================================
   FILTER EVENTS
   ===================================================== */

dateFilter.addEventListener(
    "change",
    renderVideos
);


leagueFilter.addEventListener(
    "change",
    renderVideos
);


/* =====================================================
   MOBILE MENU
   ===================================================== */

const menuBtn =
    document.getElementById(
        "menuBtn"
    );

const nav =
    document.getElementById(
        "nav"
    );


if (
    menuBtn
    &&
    nav
) {

    menuBtn.addEventListener(
        "click",
        () => {

            const open =
                nav.classList.toggle(
                    "active"
                );


            menuBtn.setAttribute(
                "aria-expanded",
                open
                ?
                "true"
                :
                "false"
            );

        }
    );

}


/* =====================================================
   SECURITY
   ===================================================== */

function escapeHtml(
    value
) {

    return String(
        value || ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(
    value
) {

    return escapeHtml(
        value
    );

}


/* =====================================================
   START
   ===================================================== */

loadVideos();

</script>
