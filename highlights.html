<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ملخصات المباريات | GOALINS</title>

<meta name="description"
      content="شاهد ملخصات وأهداف أهم مباريات كرة القدم">

<meta name="theme-color"
      content="#07111f">

<link rel="stylesheet" href="style.css">

<style>

.highlights-page {

    min-height:
        calc(100vh - 80px);

    padding:
        35px 0 70px;

}


.page-title {

    margin-bottom:
        25px;

}


.page-title small {

    color:
        var(--accent);

    font-weight:
        800;

}


.page-title h1 {

    margin:
        6px 0;

    font-size:
        32px;

}


.page-title p {

    margin:
        0;

    color:
        var(--muted);

    font-size:
        14px;

}


.filters {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        12px;

    margin-bottom:
        25px;

}


.filter {

    width:
        100%;

    padding:
        13px;

    border:
        1px solid var(--border);

    border-radius:
        12px;

    background:
        var(--card);

    color:
        white;

    font-family:
        inherit;

}


.section-header {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    margin-bottom:
        15px;

}


.section-header h2 {

    margin:
        0;

    font-size:
        20px;

}


.section-header span {

    color:
        var(--muted);

    font-size:
        12px;

}


.video-grid {

    display:
        grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap:
        16px;

}


.video-card {

    overflow:
        hidden;

    background:
        var(--card);

    border:
        1px solid var(--border);

    border-radius:
        17px;

    cursor:
        pointer;

    transition:
        transform .2s ease,
        border-color .2s ease;

}


.video-card:hover {

    transform:
        translateY(-3px);

    border-color:
        rgba(37,211,102,.45);

}


.thumbnail {

    position:
        relative;

    aspect-ratio:
        16 / 9;

    background:
        #0b1b2e;

    overflow:
        hidden;

}


.thumbnail img {

    width:
        100%;

    height:
        100%;

    object-fit:
        cover;

}


.play {

    position:
        absolute;

    top:
        50%;

    left:
        50%;

    transform:
        translate(-50%, -50%);

    width:
        58px;

    height:
        58px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        50%;

    background:
        rgba(37,211,102,.95);

    color:
        #06121f;

    font-size:
        23px;

    box-shadow:
        0 5px 25px rgba(0,0,0,.4);

}


.video-content {

    padding:
        14px;

}


.video-title {

    margin:
        0 0 9px;

    font-size:
        15px;

    line-height:
        1.6;

    font-weight:
        800;

}


.video-meta {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        10px;

    color:
        var(--muted);

    font-size:
        11px;

}


.video-league {

    color:
        var(--accent);

}


.video-source {

    margin-top:
        9px;

    color:
        var(--muted);

    font-size:
        11px;

}


.state {

    min-height:
        280px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    flex-direction:
        column;

    text-align:
        center;

    border:
        1px dashed rgba(255,255,255,.13);

    border-radius:
        18px;

    padding:
        30px;

}


.state-icon {

    font-size:
        40px;

    margin-bottom:
        12px;

}


.state h2 {

    margin:
        0 0 8px;

}


.state p {

    margin:
        0;

    color:
        var(--muted);

    font-size:
        13px;

    line-height:
        1.8;

}


.loader {

    width:
        38px;

    height:
        38px;

    border-radius:
        50%;

    border:
        3px solid
        rgba(255,255,255,.10);

    border-top-color:
        var(--accent);

    animation:
        spin .8s linear infinite;

    margin-bottom:
        15px;

}


@keyframes spin {

    to {

        transform:
            rotate(360deg);

    }

}


/* =====================================================
   VIDEO MODAL
   ===================================================== */

.video-modal {

    position:
        fixed;

    inset:
        0;

    z-index:
        9999;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        20px;

    background:
        rgba(0,0,0,.88);

}


.video-modal.active {

    display:
        flex;

}


.video-modal-box {

    width:
        min(1000px, 100%);

    background:
        #07111f;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:
        18px;

    overflow:
        hidden;

    box-shadow:
        0 20px 80px rgba(0,0,0,.6);

}


.video-modal-header {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        15px;

    padding:
        14px 18px;

}


.video-modal-title {

    margin:
        0;

    color:
        white;

    font-size:
        15px;

    line-height:
        1.5;

}


.close-video {

    width:
        40px;

    height:
        40px;

    border:
        0;

    border-radius:
        50%;

    background:
        rgba(255,255,255,.1);

    color:
        white;

    font-size:
        22px;

    cursor:
        pointer;

}


.video-frame {

    width:
        100%;

    aspect-ratio:
        16 / 9;

    border:
        0;

    display:
        block;

    background:
        #000;

}


@media(max-width:650px) {

    .highlights-page {

        padding:
            30px 0 60px;

    }


    .page-title h1 {

        font-size:
            28px;

    }


    .filters {

        grid-template-columns:
            1fr;

    }


    .video-grid {

        grid-template-columns:
            1fr;

    }


    .video-modal {

        padding:
            8px;

    }


    .video-modal-box {

        border-radius:
            12px;

    }

}

</style>

</head>


<body>


<header class="header">

<div class="container header-inner">


<a
    href="index.html"
    class="logo">

    <span>GOAL</span>INS

</a>


<button
    class="menu-btn"
    id="menuBtn"
    aria-label="القائمة"
    aria-expanded="false">

    ☰

</button>


<nav id="nav">

    <a href="matches.html">
        المباريات
    </a>

    <a href="national-teams.html">
        المنتخبات
    </a>

    <a href="highlights.html">
        الملخصات
    </a>

    <a href="goals.html">
        الأهداف
    </a>

</nav>


</div>

</header>


<main class="highlights-page">

<div class="container">


<div class="page-title">

    <small>
        GOALINS VIDEO
    </small>

    <h1>
        🎬 ملخصات المباريات
    </h1>

    <p>
        ملخصات موثوقة لأهم مباريات كرة القدم
    </p>

</div>


<div class="filters">


<select
    class="filter"
    id="dateFilter">

    <option value="all">
        جميع الأيام
    </option>

    <option value="today">
        اليوم
    </option>

    <option value="yesterday">
        أمس
    </option>

</select>


<select
    class="filter"
    id="leagueFilter">

    <option value="all">
        جميع البطولات
    </option>

    <option value="premier-league">
        🇬🇧 الدوري الإنجليزي
    </option>

    <option value="la-liga">
        🇪🇸 الدوري الإسباني
    </option>

    <option value="ligue-1">
        🇫🇷 الدوري الفرنسي
    </option>

    <option value="serie-a">
        🇮🇹 الدوري الإيطالي
    </option>

    <option value="eredivisie">
        🇳🇱 الدوري الهولندي
    </option>

    <option value="jupiler-pro-league">
        🇧🇪 الدوري البلجيكي
    </option>

    <option value="primeira-liga">
        🇵🇹 الدوري البرتغالي
    </option>

    <option value="bundesliga">
        🇩🇪 الدوري الألماني
    </option>

    <option value="champions-league">
        🏆 دوري أبطال أوروبا
    </option>

    <option value="europa-league">
        🏆 الدوري الأوروبي
    </option>

    <option value="conference-league">
        🏆 دوري المؤتمر الأوروبي
    </option>

</select>

</div>


<div class="section-header">

    <h2>
        أحدث الملخصات
    </h2>

    <span id="videoCount">
        0 فيديو
    </span>

</div>


<div
    class="video-grid"
    id="videoGrid">

    <div class="state">

        <div class="loader"></div>

        <h2>
            جاري تحميل الملخصات
        </h2>

        <p>
            يتم تحميل الملخصات الموثوقة...
        </p>

    </div>

</div>


</div>

</main>


<!-- =====================================================
     VIDEO MODAL
     ===================================================== -->

<div
    class="video-modal"
    id="videoModal">

    <div class="video-modal-box">

        <div class="video-modal-header">

            <h3
                class="video-modal-title"
                id="modalTitle">

            </h3>

            <button
                class="close-video"
                id="closeVideo"
                aria-label="إغلاق">

                ×

            </button>

        </div>


        <iframe
            class="video-frame"
            id="videoFrame"
            src=""
            title="GOALINS Football Highlight"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen>
        </iframe>

    </div>

</div>


<script>


/* =====================================================
   ELEMENTS
   ===================================================== */

const videoGrid =
    document.getElementById(
        "videoGrid"
    );


const videoCount =
    document.getElementById(
        "videoCount"
    );


const dateFilter =
    document.getElementById(
        "dateFilter"
    );


const leagueFilter =
    document.getElementById(
        "leagueFilter"
    );


const videoModal =
    document.getElementById(
        "videoModal"
    );


const videoFrame =
    document.getElementById(
        "videoFrame"
    );


const modalTitle =
    document.getElementById(
        "modalTitle"
    );


const closeVideo =
    document.getElementById(
        "closeVideo"
    );


let videos = [];


/* =====================================================
   LOAD DATA
   ===================================================== */

async function loadVideos() {

    try {

        const response =
            await fetch(
                "data/highlights.json?v="
                + Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Could not load highlights.json"
            );

        }


        const data =
            await response.json();


        videos =
            Array.isArray(
                data.highlights
            )
            ?
            data.highlights
            :
            [];


        renderVideos();

    }

    catch (error) {

        console.error(
            error
        );


        videoCount.textContent =
            "0 فيديو";


        videoGrid.innerHTML = `

            <div class="state">

                <div class="state-icon">
                    ⚠️
                </div>

                <h2>
                    تعذر تحميل الملخصات
                </h2>

                <p>
                    حاول تحديث الصفحة بعد قليل.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   DATE HELPERS
   ===================================================== */

function getToday() {

    return new Date()
        .toISOString()
        .slice(0, 10);

}


function getYesterday() {

    const date =
        new Date();

    date.setDate(
        date.getDate() - 1
    );

    return date
        .toISOString()
        .slice(0, 10);

}


/* =====================================================
   FILTER
   ===================================================== */

function getFilteredVideos() {

    const dateValue =
        dateFilter.value;


    const leagueValue =
        leagueFilter.value;


    return videos.filter(
        video => {


            if (
                dateValue === "today"
                &&
                video.date !== getToday()
            ) {

                return false;

            }


            if (
                dateValue === "yesterday"
                &&
                video.date !== getYesterday()
            ) {

                return false;

            }


            if (
                leagueValue !== "all"
                &&
                video.league_key !== leagueValue
            ) {

                return false;

            }


            return true;

        }
    );

}


/* =====================================================
   RENDER
   ===================================================== */

function renderVideos() {

    const filtered =
        getFilteredVideos();


    videoCount.textContent =
        filtered.length
        + " فيديو";


    if (
        filtered.length === 0
    ) {

        videoGrid.innerHTML = `

            <div class="state">

                <div class="state-icon">
                    🎬
                </div>

                <h2>
                    لا توجد ملخصات
                </h2>

                <p>
                    لا توجد فيديوهات موثوقة
                    مطابقة للفلاتر الحالية.
                </p>

            </div>

        `;

        return;

    }


    videoGrid.innerHTML =
        filtered
            .map(
                (
                    video,
                    index
                ) =>
                    createVideoCard(
                        video,
                        index
                    )
            )
            .join("");


    document
        .querySelectorAll(
            ".video-card"
        )
        .forEach(
            (
                card,
                index
            ) => {

                card.addEventListener(
                    "click",
                    () => {

                        openVideo(
                            filtered[index]
                        );

                    }
                );

            }
        );

}


/* =====================================================
   VIDEO CARD
   ===================================================== */

function createVideoCard(
    video,
    index
) {

    const title =
        escapeHtml(
            video.title
            ||
            (
                video.home
                + " vs "
                + video.away
            )
        );


    const thumbnail =
        video.thumbnail
        ||
        "";


    const league =
        escapeHtml(
            video.league
            || ""
        );


    const date =
        escapeHtml(
            video.date
            || ""
        );


    const source =
        escapeHtml(
            video.source
            || "Highlightly"
        );


    return `

        <article
            class="video-card"
            data-index="${index}">


            <div
                class="thumbnail">


                ${
                    thumbnail
                    ?
                    `
                    <img
                        src="${escapeAttribute(thumbnail)}"
                        alt="${title}"
                        loading="lazy">
                    `
                    :
                    `
                    <div
                        style="
                        width:100%;
                        height:100%;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-size:50px;
                        ">
                        ⚽
                    </div>
                    `
                }


                <div class="play">
                    ▶
                </div>


            </div>


            <div
                class="video-content">


                <h3
                    class="video-title">

                    ${title}

                </h3>


                <div
                    class="video-meta">

                    <span
                        class="video-league">

                        ${league}

                    </span>


                    <span>

                        ${date}

                    </span>

                </div>


                <div
                    class="video-source">

                    المصدر:
                    ${source}

                </div>


            </div>


        </article>

    `;

}


/* =====================================================
   OPEN VIDEO
   ===================================================== */

function openVideo(
    video
) {

    const embedUrl =
        video.embed_url
        ||
        video.embed;


    if (!embedUrl) {

        return;

    }


    modalTitle.textContent =
        video.title
        ||
        (
            video.home
            + " vs "
            + video.away
        );


    videoFrame.src =
        embedUrl;


    videoModal.classList.add(
        "active"
    );


    document.body.style.overflow =
        "hidden";

}


/* =====================================================
   CLOSE VIDEO
   ===================================================== */

function closeVideoModal() {

    videoModal.classList.remove(
        "active"
    );


    videoFrame.src =
        "";


    document.body.style.overflow =
        "";

}


closeVideo.addEventListener(
    "click",
    closeVideoModal
);


videoModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            videoModal
        ) {

            closeVideoModal();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeVideoModal();

        }

    }
);


/* =====================================================
   FILTER EVENTS
   ===================================================== */

dateFilter.addEventListener(
    "change",
    renderVideos
);


leagueFilter.addEventListener(
    "change",
    renderVideos
);


/* =====================================================
   MOBILE MENU
   ===================================================== */

const menuBtn =
    document.getElementById(
        "menuBtn"
    );


const nav =
    document.getElementById(
        "nav"
    );


if (
    menuBtn &&
    nav
) {

    menuBtn.addEventListener(
        "click",
        () => {

            const open =
                nav.classList.toggle(
                    "active"
                );


            menuBtn.setAttribute(
                "aria-expanded",
                open
                ? "true"
                : "false"
            );

        }
    );

}


/* =====================================================
   SECURITY HELPERS
   ===================================================== */

function escapeHtml(
    value
) {

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(
    value
) {

    return escapeHtml(
        value
    );

}


/* =====================================================
   START
   ===================================================== */

loadVideos();

</script>


</body>

</html>
