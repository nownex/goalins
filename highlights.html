<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ملخصات المباريات | GOALINS</title>

<meta name="description"
      content="شاهد ملخصات وأهداف أهم مباريات كرة القدم">

<meta name="theme-color"
      content="#07111f">

<link rel="stylesheet" href="style.css">


<style>

/* =====================================================
   GOALINS — HIGHLIGHTS
   ===================================================== */

.highlights-page {

    min-height:
        calc(100vh - 80px);

    padding:
        35px 0 70px;

}


/* =====================================================
   TITLE
   ===================================================== */

.page-title {

    margin-bottom:
        25px;

}

.page-title small {

    color:
        var(--accent);

    font-weight:
        800;

}

.page-title h1 {

    margin:
        6px 0;

    font-size:
        32px;

}

.page-title p {

    margin:
        0;

    color:
        var(--muted);

    font-size:
        14px;

}


/* =====================================================
   FILTERS
   ===================================================== */

.filters {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        12px;

    margin-bottom:
        25px;

}


.filter {

    width:
        100%;

    padding:
        13px;

    border:
        1px solid var(--border);

    border-radius:
        12px;

    background:
        var(--card);

    color:
        white;

    font-family:
        inherit;

    cursor:
        pointer;

}


/* =====================================================
   SECTION HEADER
   ===================================================== */

.section-header {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    margin-bottom:
        15px;

}

.section-header h2 {

    margin:
        0;

    font-size:
        20px;

}

.section-header span {

    color:
        var(--muted);

    font-size:
        12px;

}


/* =====================================================
   VIDEO GRID
   ===================================================== */

.video-grid {

    display:
        grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap:
        16px;

}


/* =====================================================
   VIDEO CARD
   ===================================================== */

.video-card {

    overflow:
        hidden;

    background:
        var(--card);

    border:
        1px solid var(--border);

    border-radius:
        17px;

    transition:
        transform .2s ease,
        border-color .2s ease;

    cursor:
        pointer;

}

.video-card:hover {

    transform:
        translateY(-3px);

    border-color:
        rgba(37,211,102,.45);

}


/* =====================================================
   THUMBNAIL
   ===================================================== */

.thumbnail {

    position:
        relative;

    aspect-ratio:
        16 / 9;

    background:
        #0b1b2e;

    overflow:
        hidden;

}


.thumbnail img {

    width:
        100%;

    height:
        100%;

    object-fit:
        cover;

    display:
        block;

}


.play {

    position:
        absolute;

    top:
        50%;

    left:
        50%;

    transform:
        translate(-50%, -50%);

    width:
        54px;

    height:
        54px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        50%;

    background:
        rgba(37,211,102,.95);

    color:
        #06121f;

    font-size:
        22px;

    box-shadow:
        0 5px 25px rgba(0,0,0,.4);

}


.duration {

    position:
        absolute;

    bottom:
        8px;

    left:
        8px;

    padding:
        4px 7px;

    border-radius:
        6px;

    background:
        rgba(0,0,0,.75);

    color:
        white;

    font-size:
        10px;

}


/* =====================================================
   CARD CONTENT
   ===================================================== */

.video-content {

    padding:
        14px;

}


.video-title {

    margin:
        0 0 9px;

    font-size:
        15px;

    line-height:
        1.6;

    font-weight:
        800;

}


.video-meta {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    color:
        var(--muted);

    font-size:
        11px;

    gap:
        10px;

}


.video-league {

    color:
        var(--accent);

}


/* =====================================================
   CHANNEL
   ===================================================== */

.video-channel {

    margin-top:
        8px;

    color:
        var(--muted);

    font-size:
        11px;

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

}


/* =====================================================
   EMPTY / ERROR STATE
   ===================================================== */

.state {

    min-height:
        280px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    flex-direction:
        column;

    text-align:
        center;

    border:
        1px dashed
        rgba(255,255,255,.13);

    border-radius:
        18px;

    padding:
        30px;

}


.state-icon {

    font-size:
        40px;

    margin-bottom:
        12px;

}


.state h2 {

    margin:
        0 0 8px;

}


.state p {

    margin:
        0;

    color:
        var(--muted);

    font-size:
        13px;

    line-height:
        1.8;

}


/* =====================================================
   LOADER
   ===================================================== */

.loader {

    width:
        38px;

    height:
        38px;

    border-radius:
        50%;

    border:
        3px solid
        rgba(255,255,255,.10);

    border-top-color:
        var(--accent);

    animation:
        spin .8s linear infinite;

    margin-bottom:
        15px;

}


@keyframes spin {

    to {

        transform:
            rotate(360deg);

    }

}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:650px) {

    .highlights-page {

        padding:
            30px 0 60px;

    }

    .page-title h1 {

        font-size:
            28px;

    }

    .filters {

        grid-template-columns:
            1fr;

    }

    .video-grid {

        grid-template-columns:
            1fr;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
     ===================================================== -->

<header class="header">

<div class="container header-inner">


<a
    href="index.html"
    class="logo">

    <span>GOAL</span>INS

</a>


<button
    class="menu-btn"
    id="menuBtn"
    aria-label="القائمة"
    aria-expanded="false">

    ☰

</button>


<nav id="nav">

    <a href="matches.html">
        المباريات
    </a>

    <a href="national-teams.html">
        المنتخبات
    </a>

    <a href="highlights.html">
        الملخصات
    </a>

    <a href="goals.html">
        الأهداف
    </a>

</nav>


</div>

</header>



<!-- =====================================================
     MAIN
     ===================================================== -->

<main class="highlights-page">

<div class="container">


<!-- =====================================================
     TITLE
     ===================================================== -->

<div class="page-title">

    <small>
        GOALINS VIDEO
    </small>

    <h1>
        🎬 ملخصات المباريات
    </h1>

    <p>
        شاهد ملخصات أهم مباريات كرة القدم
    </p>

</div>



<!-- =====================================================
     FILTERS
     ===================================================== -->

<div class="filters">


<select
    class="filter"
    id="dateFilter">

    <option value="all">
        جميع الأيام
    </option>

    <option value="today">
        اليوم
    </option>

    <option value="yesterday">
        أمس
    </option>

</select>



<select
    class="filter"
    id="leagueFilter">

    <option value="all">
        جميع البطولات
    </option>

    <option value="premier-league">
        🇬🇧 الدوري الإنجليزي
    </option>

    <option value="la-liga">
        🇪🇸 الدوري الإسباني
    </option>

    <option value="ligue-1">
        🇫🇷 الدوري الفرنسي
    </option>

    <option value="serie-a">
        🇮🇹 الدوري الإيطالي
    </option>

    <option value="eredivisie">
        🇳🇱 الدوري الهولندي
    </option>

    <option value="jupiler-pro-league">
        🇧🇪 الدوري البلجيكي
    </option>

    <option value="primeira-liga">
        🇵🇹 الدوري البرتغالي
    </option>

    <option value="bundesliga">
        🇩🇪 الدوري الألماني
    </option>

    <option value="champions-league">
        🏆 دوري أبطال أوروبا
    </option>

    <option value="europa-league">
        🏆 الدوري الأوروبي
    </option>

    <option value="conference-league">
        🏆 دوري المؤتمر الأوروبي
    </option>

</select>

</div>



<!-- =====================================================
     SECTION HEADER
     ===================================================== -->

<div class="section-header">

    <h2>
        أحدث الملخصات
    </h2>

    <span id="videoCount">
        جاري التحميل...
    </span>

</div>



<!-- =====================================================
     VIDEO GRID
     ===================================================== -->

<div
    class="video-grid"
    id="videoGrid">


<div class="state">

    <div class="loader"></div>

    <h2>
        جاري تحميل الملخصات
    </h2>

    <p>
        يتم جلب أحدث الفيديوهات...
    </p>

</div>


</div>


</div>

</main>



<script>

/* =====================================================
   GOALINS — LIVE HIGHLIGHTS ENGINE
   ===================================================== */


/* =====================================================
   ELEMENTS
   ===================================================== */

const videoGrid =
    document.getElementById(
        "videoGrid"
    );


const videoCount =
    document.getElementById(
        "videoCount"
    );


const dateFilter =
    document.getElementById(
        "dateFilter"
    );


const leagueFilter =
    document.getElementById(
        "leagueFilter"
    );


/* =====================================================
   DATA
   ===================================================== */

let videos = [];


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   ALGERIA DATE
   ===================================================== */

function getAlgeriaDate(
    offsetDays = 0
) {

    const now =
        new Date();

    const algeriaTime =
        new Date(
            now.toLocaleString(
                "en-US",
                {
                    timeZone:
                        "Africa/Algiers"
                }
            )
        );


    algeriaTime.setDate(
        algeriaTime.getDate()
        + offsetDays
    );


    const year =
        algeriaTime.getFullYear();

    const month =
        String(
            algeriaTime.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const day =
        String(
            algeriaTime.getDate()
        ).padStart(
            2,
            "0"
        );


    return `${year}-${month}-${day}`;

}


/* =====================================================
   LOAD JSON
   ===================================================== */

async function loadHighlights() {

    videoGrid.innerHTML = `

        <div class="state">

            <div class="loader"></div>

            <h2>
                جاري تحميل الملخصات
            </h2>

            <p>
                يتم جلب أحدث الفيديوهات...
            </p>

        </div>

    `;


    try {

        const response =
            await fetch(
                "data/highlights.json?v="
                + Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP "
                + response.status
            );

        }


        const data =
            await response.json();


        if (
            Array.isArray(
                data
            )
        ) {

            videos =
                data;

        }

        else if (
            data &&
            Array.isArray(
                data.highlights
            )
        ) {

            videos =
                data.highlights;

        }

        else {

            videos = [];

        }


        console.log(
            "GOALINS highlights:",
            videos
        );


        renderVideos();


    }

    catch (error) {

        console.error(
            "GOALINS:",
            error
        );


        videoCount.textContent =
            "0 فيديو";


        videoGrid.innerHTML = `

            <div class="state">

                <div class="state-icon">
                    ⚠️
                </div>

                <h2>
                    تعذر تحميل الملخصات
                </h2>

                <p>
                    تأكد من وجود
                    data/highlights.json
                    ثم حاول تحديث الصفحة.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   FILTER VIDEOS
   ===================================================== */

function getFilteredVideos() {

    let result =
        [...videos];


    /* ---------------------------------------------
       LEAGUE
       --------------------------------------------- */

    const selectedLeague =
        leagueFilter.value;


    if (
        selectedLeague !== "all"
    ) {

        result =
            result.filter(
                video =>
                    video.league_key
                    === selectedLeague
            );

    }


    /* ---------------------------------------------
       DATE
       --------------------------------------------- */

    const selectedDate =
        dateFilter.value;


    if (
        selectedDate === "today"
    ) {

        const today =
            getAlgeriaDate(0);


        result =
            result.filter(
                video =>
                    video.date
                    === today
            );

    }


    if (
        selectedDate === "yesterday"
    ) {

        const yesterday =
            getAlgeriaDate(-1);


        result =
            result.filter(
                video =>
                    video.date
                    === yesterday
            );

    }


    return result;

}


/* =====================================================
   RENDER VIDEOS
   ===================================================== */

function renderVideos() {

    const filtered =
        getFilteredVideos();


    videoCount.textContent =
        filtered.length
        + " فيديو";


    if (
        filtered.length === 0
    ) {

        videoGrid.innerHTML = `

            <div class="state">

                <div class="state-icon">
                    🎬
                </div>

                <h2>
                    لا توجد ملخصات
                </h2>

                <p>
                    لا توجد فيديوهات مطابقة للفلاتر الحالية.
                </p>

            </div>

        `;

        return;

    }


    videoGrid.innerHTML =
        filtered
        .map(
            video =>
                createVideoCard(
                    video
                )
        )
        .join("");

}


/* =====================================================
   CREATE VIDEO CARD
   ===================================================== */

function createVideoCard(
    video
) {

    const videoId =
        escapeHtml(
            video.video_id
        );


    const title =
        escapeHtml(
            video.title
            ||
            `${video.home || ""} vs ${video.away || ""}`
        );


    const thumbnail =
        escapeHtml(
            video.thumbnail
            ||
            (
                video.video_id
                ?
                `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`
                :
                ""
            )
        );


    const league =
        escapeHtml(
            video.league
            ||
            "Football"
        );


    const date =
        escapeHtml(
            video.date
            ||
            ""
        );


    const channel =
        escapeHtml(
            video.channel
            ||
            ""
        );


    const youtubeUrl =
        escapeHtml(
            video.youtube_url
            ||
            (
                video.video_id
                ?
                `https://www.youtube.com/watch?v=${videoId}`
                :
                "#"
            )
        );


    return `

        <article
            class="video-card"
            onclick="openVideo('${youtubeUrl}')">


            <div
                class="thumbnail">


                ${
                    thumbnail
                    ?

                    `

                    <img
                        src="${thumbnail}"
                        alt="${title}"
                        loading="lazy">

                    `

                    :

                    `

                    <div
                        style="
                            width:100%;
                            height:100%;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            font-size:45px;
                        ">

                        🎬

                    </div>

                    `
                }


                <div
                    class="play">

                    ▶

                </div>


            </div>


            <div
                class="video-content">


                <h3
                    class="video-title">

                    ${title}

                </h3>


                <div
                    class="video-meta">


                    <span
                        class="video-league">

                        ${league}

                    </span>


                    <span>

                        ${date}

                    </span>


                </div>


                ${
                    channel

                    ?

                    `

                    <div
                        class="video-channel">

                        ▶ ${channel}

                    </div>

                    `

                    :

                    ""
                }


            </div>


        </article>

    `;

}


/* =====================================================
   OPEN YOUTUBE VIDEO
   ===================================================== */

function openVideo(
    url
) {

    if (
        !url ||
        url === "#"
    ) {

        return;

    }


    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );

}


/* =====================================================
   FILTER EVENTS
   ===================================================== */

dateFilter.addEventListener(
    "change",
    renderVideos
);


leagueFilter.addEventListener(
    "change",
    renderVideos
);


/* =====================================================
   MOBILE MENU
   ===================================================== */

const menuBtn =
    document.getElementById(
        "menuBtn"
    );


const nav =
    document.getElementById(
        "nav"
    );


if (
    menuBtn &&
    nav
) {

    menuBtn.addEventListener(
        "click",
        () => {

            const open =
                nav.classList.toggle(
                    "active"
                );


            menuBtn.setAttribute(
                "aria-expanded",
                open
                ? "true"
                : "false"
            );

        }
    );

}


/* =====================================================
   START
   ===================================================== */

loadHighlights();

</script>


</body>

</html>
