<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>المباريات | GOALINS</title>

    <meta name="description"
          content="مباريات كرة القدم القادمة ونتائج المباريات على GOALINS">

    <meta name="theme-color"
          content="#07111f">

    <link rel="stylesheet"
          href="style.css">

    <style>

        /* ================= PAGE ================= */

        .matches-page {
            min-height: calc(100vh - 72px);
            padding: 42px 0 80px;
        }

        .page-top {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
        }

        .page-title span {
            color: var(--accent);
            font-size: 13px;
            font-weight: 800;
        }

        .page-title h1 {
            margin-top: 5px;
            font-size: 34px;
        }

        .page-title p {
            margin-top: 7px;
            color: var(--muted);
            font-size: 14px;
        }

        .back-home {
            color: var(--accent);
            font-size: 14px;
            font-weight: 700;
        }


        /* ================= DATE ================= */

        .date-filter {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        .date-btn {
            min-height: 58px;

            border: 1px solid var(--border);
            border-radius: 14px;

            background: var(--card);
            color: white;

            font-family: inherit;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .date-btn:hover {
            background: var(--card-hover);
        }

        .date-btn.active {
            background: rgba(37, 211, 102, 0.12);
            border-color: var(--accent);
            color: var(--accent);
        }

        .date-btn strong {
            display: block;
            font-size: 15px;
        }

        .date-btn small {
            display: block;
            margin-top: 2px;
            color: var(--muted);
            font-size: 11px;
        }

        .date-btn.active small {
            color: var(--accent);
        }


        /* ================= CUSTOM DATE ================= */

        .custom-date {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 13px 15px;

            margin-bottom: 12px;

            background: var(--card);

            border: 1px solid var(--border);
            border-radius: 14px;
        }

        .custom-date label {
            color: var(--muted);
            font-size: 13px;
        }

        .custom-date input {
            flex: 1;

            min-width: 0;

            padding: 10px 12px;

            background: #081321;

            border: 1px solid var(--border);
            border-radius: 9px;

            color: white;

            font-family: inherit;
        }

        .custom-date input:focus {
            outline: none;
            border-color: var(--accent);
        }


        /* ================= LEAGUE ================= */

        .league-filter {
            margin-bottom: 30px;
        }

        .league-filter label {
            display: block;

            margin-bottom: 7px;

            color: var(--muted);

            font-size: 13px;
        }

        .league-filter select {
            width: 100%;

            padding: 13px 14px;

            background: var(--card);

            border: 1px solid var(--border);
            border-radius: 12px;

            color: white;

            font-family: inherit;
            font-size: 14px;

            cursor: pointer;
        }

        .league-filter select:focus {
            outline: none;
            border-color: var(--accent);
        }


        /* ================= SUMMARY ================= */

        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 15px;

            color: var(--muted);

            font-size: 13px;
        }

        .results-info strong {
            color: white;
        }


        /* ================= MATCH LIST ================= */

        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }


        /* ================= LEAGUE GROUP ================= */

        .league-group {
            overflow: hidden;

            background: var(--card);

            border: 1px solid var(--border);
            border-radius: 17px;
        }

        .league-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 13px 16px;

            background: rgba(255,255,255,0.025);

            border-bottom: 1px solid var(--border);
        }

        .league-name {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 14px;
            font-weight: 800;
        }

        .league-name img {
            width: 28px;
            height: 28px;

            object-fit: contain;
        }

        .league-country {
            color: var(--muted);
            font-size: 11px;
        }


        /* ================= MATCH ================= */

        .match-card {
            position: relative;

            display: grid;

            grid-template-columns: 1fr 90px 1fr;

            align-items: center;

            min-height: 105px;

            padding: 14px 17px;

            border-bottom: 1px solid var(--border);
        }

        .match-card:last-child {
            border-bottom: 0;
        }

        .team {
            display: flex;
            align-items: center;

            gap: 10px;

            font-size: 14px;
            font-weight: 700;
        }

        .team.away {
            justify-content: flex-start;
            text-align: left;
        }

        .team.home {
            justify-content: flex-end;
            text-align: right;
        }

        .team-logo {
            width: 38px;
            height: 38px;

            object-fit: contain;

            flex-shrink: 0;
        }

        .team-name {
            line-height: 1.3;
        }


        /* ================= CENTER ================= */

        .match-center {
            display: flex;
            align-items: center;
            justify-content: center;

            flex-direction: column;

            text-align: center;
        }

        .match-time {
            color: var(--accent);

            font-size: 15px;
            font-weight: 900;
        }

        .match-score {
            font-size: 18px;
            font-weight: 900;
        }

        .match-status {
            margin-top: 2px;

            color: var(--muted);

            font-size: 9px;
        }


        /* ================= LIVE ================= */

        .live {
            color: #ff4d5e !important;
        }

        .live-dot {
            display: inline-block;

            width: 6px;
            height: 6px;

            margin-left: 4px;

            border-radius: 50%;

            background: #ff4d5e;
        }


        /* ================= EMPTY / LOADING ================= */

        .state-box {
            min-height: 270px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-direction: column;

            text-align: center;

            padding: 30px;

            border: 1px dashed rgba(255,255,255,0.12);
            border-radius: 18px;

            background: rgba(255,255,255,0.015);
        }

        .state-icon {
            width: 65px;
            height: 65px;

            display: grid;
            place-items: center;

            margin-bottom: 15px;

            border-radius: 50%;

            background: rgba(37,211,102,0.1);

            font-size: 28px;
        }

        .state-box h2 {
            margin-bottom: 7px;

            font-size: 18px;
        }

        .state-box p {
            color: var(--muted);

            font-size: 13px;
        }

        .loader {
            width: 35px;
            height: 35px;

            margin-bottom: 15px;

            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }


        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .matches-page {
                padding: 30px 0 60px;
            }

            .page-top {
                align-items: flex-start;
                flex-direction: column;
            }

            .page-title h1 {
                font-size: 29px;
            }

            .date-btn {
                min-height: 54px;
            }

            .date-btn strong {
                font-size: 13px;
            }

            .date-btn small {
                font-size: 10px;
            }

            .custom-date {
                flex-direction: column;
                align-items: stretch;
            }

            .league-header {
                padding: 11px 13px;
            }

            .match-card {
                grid-template-columns: 1fr 65px 1fr;

                min-height: 92px;

                padding: 12px 9px;
            }

            .team {
                gap: 6px;
                font-size: 11px;
            }

            .team-logo {
                width: 31px;
                height: 31px;
            }

            .match-time {
                font-size: 12px;
            }

            .match-score {
                font-size: 16px;
            }

            .results-info {
                font-size: 11px;
            }
        }

    </style>

</head>
