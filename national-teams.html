<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>المنتخبات | GOALINS</title>

    <meta name="description"
          content="مباريات المنتخبات الوطنية القادمة والنتائج">

    <meta name="theme-color"
          content="#07111f">

    <link rel="stylesheet"
          href="style.css">


    <style>

        /* =====================================================
           GOALINS — NATIONAL TEAMS
           ===================================================== */

        .national-page {

            min-height: calc(100vh - 80px);

            padding: 40px 0 70px;

        }


        /* =====================================================
           PAGE HEADER
           ===================================================== */

        .page-head {

            display: flex;

            justify-content: space-between;

            align-items: flex-end;

            gap: 20px;

            margin-bottom: 25px;

        }


        .page-head small {

            color: var(--accent);

            font-weight: 800;

        }


        .page-head h1 {

            margin: 6px 0;

            font-size: 32px;

        }


        .page-head p {

            color: var(--muted);

            font-size: 14px;

        }


        .back-link {

            color: var(--accent);

            font-weight: 700;

            text-decoration: none;

        }


        /* =====================================================
           DATE BUTTONS
           ===================================================== */

        .date-buttons {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-bottom: 12px;

        }


        .date-btn {

            padding: 14px 10px;

            border-radius: 13px;

            border: 1px solid var(--border);

            background: var(--card);

            color: white;

            font-family: inherit;

            cursor: pointer;

            transition: .2s ease;

        }


        .date-btn:hover {

            background: var(--card-hover);

        }


        .date-btn strong {

            display: block;

        }


        .date-btn small {

            display: block;

            margin-top: 3px;

            color: var(--muted);

        }


        .date-btn.active {

            border-color: var(--accent);

            color: var(--accent);

            background:
                rgba(37,211,102,.10);

        }


        .date-btn.active small {

            color: var(--accent);

        }


        /* =====================================================
           DATE PICKER
           ===================================================== */

        .date-picker {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 15px;

        }


        .date-picker label {

            color: var(--muted);

            font-size: 13px;

        }


        .date-picker input {

            flex: 1;

            padding: 12px;

            border-radius: 10px;

            border:
                1px solid var(--border);

            background: var(--card);

            color: white;

            font-family: inherit;

        }


        .date-picker input:focus {

            outline: none;

            border-color: var(--accent);

        }


        /* =====================================================
           COMPETITION FILTER
           ===================================================== */

        .filter-box {

            margin-bottom: 25px;

        }


        .filter-box label {

            display: block;

            color: var(--muted);

            margin-bottom: 7px;

            font-size: 13px;

        }


        .filter-box select {

            width: 100%;

            padding: 13px;

            border-radius: 12px;

            border:
                1px solid var(--border);

            background: var(--card);

            color: white;

            font-family: inherit;

            cursor: pointer;

        }


        .filter-box select:focus {

            outline: none;

            border-color: var(--accent);

        }


        /* =====================================================
           RESULTS INFO
           ===================================================== */

        .results-info {

            display: flex;

            justify-content: space-between;

            color: var(--muted);

            margin-bottom: 14px;

            font-size: 13px;

        }


        .results-info strong {

            color: white;

        }


        /* =====================================================
           MATCHES LIST
           ===================================================== */

        .matches-list {

            display: flex;

            flex-direction: column;

            gap: 12px;

        }


        /* =====================================================
           LEAGUE BOX
           ===================================================== */

        .league-box {

            overflow: hidden;

            border:
                1px solid var(--border);

            border-radius: 17px;

            background: var(--card);

        }


        .league-head {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            padding: 13px 15px;

            border-bottom:
                1px solid var(--border);

        }


        .league-title {

            display: flex;

            align-items: center;

            gap: 9px;

        }


        .league-head img {

            width: 30px;

            height: 30px;

            object-fit: contain;

        }


        .league-head strong {

            font-size: 14px;

        }


        .league-country {

            color: var(--muted);

            font-size: 11px;

        }


        /* =====================================================
           MATCH
           ===================================================== */

        .match {

            display: grid;

            grid-template-columns:
                1fr 90px 1fr;

            align-items: center;

            min-height: 108px;

            padding: 12px 15px;

            border-bottom:
                1px solid var(--border);

        }


        .match:last-child {

            border-bottom: 0;

        }


        /* =====================================================
           TEAM
           ===================================================== */

        .team {

            display: flex;

            align-items: center;

            gap: 9px;

            font-size: 13px;

            font-weight: 800;

        }


        .team.home {

            justify-content: flex-end;

            text-align: right;

        }


        .team.away {

            justify-content: flex-start;

            text-align: left;

        }


        .team img {

            width: 42px;

            height: 42px;

            object-fit: contain;

            flex-shrink: 0;

        }


        /* =====================================================
           CENTER
           ===================================================== */

        .center {

            text-align: center;

        }


        .time {

            color: var(--accent);

            font-size: 15px;

            font-weight: 900;

        }


        .score {

            font-size: 19px;

            font-weight: 900;

        }


        .status {

            margin-top: 4px;

            color: var(--muted);

            font-size: 10px;

        }


        .live {

            color: #ff5364;

        }


        /* =====================================================
           STATE
           ===================================================== */

        .state {

            min-height: 280px;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            text-align: center;

            border:
                1px dashed
                rgba(255,255,255,.13);

            border-radius: 18px;

            padding: 30px;

        }


        .state-icon {

            font-size: 38px;

            margin-bottom: 12px;

        }


        .state h2 {

            margin-bottom: 7px;

        }


        .state p {

            color: var(--muted);

            font-size: 13px;

            line-height: 1.8;

        }


        /* =====================================================
           LOADER
           ===================================================== */

        .loader {

            width: 38px;

            height: 38px;

            border-radius: 50%;

            border:
                3px solid
                rgba(255,255,255,.1);

            border-top-color:
                var(--accent);

            animation:
                spin .8s linear infinite;

            margin-bottom: 15px;

        }


        @keyframes spin {

            to {

                transform: rotate(360deg);

            }

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media(max-width:650px) {

            .national-page {

                padding: 30px 0 60px;

            }


            .page-head {

                align-items: flex-start;

                flex-direction: column;

            }


            .page-head h1 {

                font-size: 28px;

            }


            .date-buttons {

                gap: 7px;

            }


            .date-btn {

                padding: 12px 5px;

                font-size: 12px;

            }


            .match {

                grid-template-columns:
                    1fr 60px 1fr;

                padding:
                    10px 7px;

            }


            .team {

                font-size: 10px;

                gap: 5px;

            }


            .team img {

                width: 33px;

                height: 33px;

            }


            .time {

                font-size: 12px;

            }


            .score {

                font-size: 16px;

            }


            .league-head {

                padding:
                    11px 12px;

            }

        }

    </style>

</head>


<body>

<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script>


/* =====================================================
   ELEMENTS
   ===================================================== */

const list =
    document.getElementById(
        "matchesList"
    );


const count =
    document.getElementById(
        "count"
    );


const dateText =
    document.getElementById(
        "dateText"
    );


const dateInput =
    document.getElementById(
        "date"
    );


const competition =
    document.getElementById(
        "competition"
    );


const dateButtons =
    document.querySelectorAll(
        ".date-btn"
    );


/* =====================================================
   STATE
   ===================================================== */

let matches = [];

let selectedDate =
    localDate(0);

let selectedCompetition =
    "all";


/* =====================================================
   LOCAL DATE
   ===================================================== */

function localDate(offset = 0) {

    const date =
        new Date();


    date.setDate(
        date.getDate() + offset
    );


    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            date.getDate()
        ).padStart(2, "0");


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =====================================================
   LOAD MATCHES
   ===================================================== */

async function loadMatches() {

    try {


        const response =
            await fetch(
                "data/matches.json?v=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
         * دعم أكثر من بنية
         */

        if (
            Array.isArray(data)
        ) {

            matches =
                data;

        }

        else if (
            Array.isArray(
                data.matches
            )
        ) {

            matches =
                data.matches;

        }

        else if (
            Array.isArray(
                data.response
            )
        ) {

            matches =
                data.response;

        }

        else {

            matches = [];

        }


        console.log(
            "GOALINS:",
            matches.length,
            "matches loaded"
        );


        render();


    }

    catch(error) {


        console.error(
            "GOALINS:",
            error
        );


        list.innerHTML = `

            <div class="state">

                <div class="state-icon">
                    ⚠️
                </div>

                <h2>
                    تعذر تحميل المباريات
                </h2>

                <p>
                    لم تتمكن الصفحة من قراءة
                    ملف المباريات.
                    <br><br>
                    data/matches.json
                </p>

            </div>

        `;

    }

}


/* =====================================================
   GET MATCH DATE
   ===================================================== */

function matchDate(match) {

    return String(

        match.date ||

        match.fixture?.date ||

        ""

    ).substring(0, 10);

}


/* =====================================================
   GET LEAGUE
   ===================================================== */

function league(match) {

    return (

        match.league ||

        match.competition ||

        {}

    );

}


/* =====================================================
   IMPORTANT:
   NATIONAL COMPETITIONS ONLY
   ===================================================== */

function isNational(match) {


    const l =
        league(match);


    const name =
        String(
            l.name || ""
        )
        .toLowerCase()
        .trim();


    /*
     * ================================================
     * أولاً:
     * استبعاد بطولات الأندية
     * ================================================
     */


    const clubCompetitionTerms = [

        "friendlies clubs",

        "club friendly",

        "club friendlies",

        "clubs friendlies",

        "club friendly matches"

    ];


    if (

        clubCompetitionTerms.some(
            term =>
                name.includes(term)
        )

    ) {

        return false;

    }


    /*
     * ================================================
     * مسابقات المنتخبات
     * ================================================
     */


    const nationalTerms = [

        /* كأس العالم */

        "world cup",

        "world cup qualification",

        "world cup qualifiers",

        /* أوروبا */

        "euro",

        "european championship",

        "european qualifiers",

        /* أفريقيا */

        "africa cup of nations",

        "afcon",

        /* دوري الأمم */

        "nations league",

        /* أمريكا */

        "copa america",

        "copa mundial",

        /* آسيا */

        "asian cup",

        "afc asian cup",

        /* أمريكا الشمالية */

        "gold cup",

        "concacaf",

        /* أوقيانوسيا */

        "oceania",

        /* مباريات المنتخبات الودية */

        "international friendly",

        "international friendlies",

        "friendlies"

    ];


    return nationalTerms.some(
        term =>
            name.includes(term)
    );

}


/* =====================================================
   COMPETITION FILTER
   ===================================================== */

function competitionOK(match) {


    if (
        selectedCompetition ===
        "all"
    ) {

        return true;

    }


    const name =
        String(
            league(match).name || ""
        )
        .toLowerCase();


    const map = {


        world: [

            "world cup"

        ],


        "world-qualifiers": [

            "world cup qualification",

            "world cup qualifiers"

        ],


        euro: [

            "euro",

            "european championship",

            "european qualifiers"

        ],


        afcon: [

            "africa cup of nations",

            "afcon"

        ],


        nations: [

            "nations league"

        ],


        copa: [

            "copa america",

            "copa mundial"

        ],


        asian: [

            "asian cup",

            "afc asian cup"

        ],


        friendly: [

            "international friendly",

            "international friendlies",

            "friendlies"

        ]

    };


    const terms =
        map[
            selectedCompetition
        ] || [];


    /*
     * Friendlies Clubs يجب أن تبقى
     * مستبعدة حتى عند اختيار الوديات.
     */


    if (

        name.includes(
            "friendlies clubs"
        ) ||

        name.includes(
            "club friendly"
        ) ||

        name.includes(
            "club friendlies"
        )

    ) {

        return false;

    }


    return terms.some(
        term =>
            name.includes(term)
    );

}


/* =====================================================
   HOME TEAM
   ===================================================== */

function homeTeam(match) {

    return (

        match.home ||

        match.teams?.home ||

        {}

    );

}


/* =====================================================
   AWAY TEAM
   ===================================================== */

function awayTeam(match) {

    return (

        match.away ||

        match.teams?.away ||

        {}

    );

}


/* =====================================================
   HOME GOALS
   ===================================================== */

function goalsHome(match) {

    return (

        match.goals?.home ??

        match.score?.fulltime?.home ??

        "-"

    );

}


/* =====================================================
   AWAY GOALS
   ===================================================== */

function goalsAway(match) {

    return (

        match.goals?.away ??

        match.score?.fulltime?.away ??

        "-"

    );

}


/* =====================================================
   STATUS
   ===================================================== */

function matchStatus(match) {

    return String(

        match.status ||

        match.fixture?.status?.short ||

        ""

    );

}


/* =====================================================
   TIME
   ===================================================== */

function matchTime(match) {


    const value =

        match.date ||

        match.fixture?.date;


    if (!value) {

        return "--:--";

    }


    const date =
        new Date(value);


    return date.toLocaleTimeString(

        "ar-DZ",

        {

            hour:
                "2-digit",

            minute:
                "2-digit",

            hour12:
                false

        }

    );

}


/* =====================================================
   RENDER
   ===================================================== */

function render() {


    let filtered =

        matches.filter(
            match =>
                matchDate(match) ===
                selectedDate
        );


    /*
     * المنتخبات فقط
     */

    filtered =

        filtered.filter(
            match =>
                isNational(match)
        );


    /*
     * البطولة
     */

    filtered =

        filtered.filter(
            match =>
                competitionOK(match)
        );


    /*
     * ترتيب الوقت
     */

    filtered.sort(

        (a, b) =>

            Number(
                a.timestamp ||
                a.fixture?.timestamp ||
                0
            )

            -

            Number(
                b.timestamp ||
                b.fixture?.timestamp ||
                0
            )

    );


    count.textContent =
        filtered.length;


    dateText.textContent =
        "مباريات المنتخبات " +
        formatDate(
            selectedDate
        );


    /*
     * لا توجد مباريات
     */

    if (
        filtered.length === 0
    ) {

        list.innerHTML = `

            <div class="state">

                <div class="state-icon">
                    🌍
                </div>

                <h2>
                    لا توجد مباريات
                </h2>

                <p>
                    لا توجد مباريات منتخبات
                    في التاريخ أو البطولة
                    المحددة حاليًا.
                </p>

            </div>

        `;

        return;

    }


    /*
     * تجميع البطولات
     */

    const groups = {};


    filtered.forEach(
        match => {


            const l =
                league(match);


            const key =

                l.id ||

                l.name ||

                "other";


            if (
                !groups[key]
            ) {

                groups[key] = {

                    league: l,

                    matches: []

                };

            }


            groups[key]
                .matches
                .push(match);

        }
    );


    /*
     * عرض البطولات
     */

    list.innerHTML =

        Object.values(groups)

            .map(
                group =>
                    createLeague(
                        group
                    )
            )

            .join("");

}


/* =====================================================
   CREATE LEAGUE
   ===================================================== */

function createLeague(group) {


    const l =
        group.league || {};


    const logo =

        l.logo

        ?

        `

            <img

                src="${safeURL(
                    l.logo
                )}"

                alt=""

                loading="lazy">

        `

        :

        "";


    return `

        <section
            class="league-box">


            <div
                class="league-head">


                <div
                    class="league-title">


                    ${logo}


                    <strong>

                        ${escapeHTML(

                            l.name ||

                            "منافسة دولية"

                        )}

                    </strong>


                </div>


                <span
                    class="league-country">

                    ${escapeHTML(

                        l.country ||

                        ""

                    )}

                </span>


            </div>


            ${

                group.matches

                    .map(
                        createMatch
                    )

                    .join("")

            }


        </section>

    `;

}


/* =====================================================
   CREATE MATCH
   ===================================================== */

function createMatch(match) {


    const home =
        homeTeam(match);


    const away =
        awayTeam(match);


    const status =
        matchStatus(match);


    const liveStatuses = [

        "1H",

        "2H",

        "HT",

        "ET",

        "P",

        "LIVE"

    ];


    const finishedStatuses = [

        "FT",

        "AET",

        "PEN"

    ];


    const isLive =
        liveStatuses.includes(
            status
        );


    const finished =
        finishedStatuses.includes(
            status
        );


    let center;


    /*
     * انتهت
     */

    if (finished) {


        center = `

            <div class="score">

                ${goalsHome(match)}

                -

                ${goalsAway(match)}

            </div>


            <div class="status">

                انتهت

            </div>

        `;

    }


    /*
     * مباشر
     */

    else if (isLive) {


        center = `

            <div
                class="score live">

                🔴

                ${goalsHome(match)}

                -

                ${goalsAway(match)}

            </div>


            <div
                class="status live">

                مباشر

            </div>

        `;

    }


    /*
     * لم تبدأ
     */

    else {


        center = `

            <div class="time">

                ${matchTime(match)}

            </div>


            <div class="status">

                لم تبدأ

            </div>

        `;

    }


    return `

        <div class="match">


            <!-- HOME -->

            <div
                class="team home">


                <span>

                    ${escapeHTML(

                        home.name ||

                        "المنتخب"

                    )}

                </span>


                ${

                    home.logo

                    ?

                    `

                        <img

                            src="${safeURL(
                                home.logo
                            )}"

                            alt=""

                            loading="lazy">

                    `

                    :

                    ""

                }


            </div>



            <!-- CENTER -->

            <div class="center">

                ${center}

            </div>



            <!-- AWAY -->

            <div
                class="team away">


                ${

                    away.logo

                    ?

                    `

                        <img

                            src="${safeURL(
                                away.logo
                            )}"

                            alt=""

                            loading="lazy">

                    `

                    :

                    ""

                }


                <span>

                    ${escapeHTML(

                        away.name ||

                        "المنتخب"

                    )}

                </span>


            </div>


        </div>

    `;

}


/* =====================================================
   DATE FORMAT
   ===================================================== */

function formatDate(value) {


    const date =

        new Date(
            value +
            "T12:00:00"
        );


    return date.toLocaleDateString(

        "ar-DZ",

        {

            day:
                "numeric",

            month:
                "long"

        }

    );

}


/* =====================================================
   SAFE URL
   ===================================================== */

function safeURL(url) {


    try {


        const u =

            new URL(

                url,

                document.baseURI

            );


        if (

            u.protocol !==
                "http:" &&

            u.protocol !==
                "https:"

        ) {

            return "";

        }


        return u.href;


    }

    catch {

        return "";

    }

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value) {


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   DATE BUTTONS
   ===================================================== */

dateButtons.forEach(

    button => {


        button.addEventListener(

            "click",

            () => {


                dateButtons.forEach(

                    btn =>
                        btn.classList
                            .remove(
                                "active"
                            )

                );


                button.classList.add(
                    "active"
                );


                selectedDate =

                    localDate(

                        Number(
                            button
                                .dataset
                                .offset
                        )

                    );


                dateInput.value = "";


                render();

            }

        );

    }

);


/* =====================================================
   CUSTOM DATE
   ===================================================== */

dateInput.addEventListener(

    "change",

    () => {


        if (
            !dateInput.value
        ) {

            return;

        }


        dateButtons.forEach(

            btn =>
                btn.classList
                    .remove(
                        "active"
                    )

        );


        selectedDate =
            dateInput.value;


        render();

    }

);


/* =====================================================
   COMPETITION
   ===================================================== */

competition.addEventListener(

    "change",

    () => {


        selectedCompetition =

            competition.value;


        render();

    }

);


/* =====================================================
   MOBILE MENU
   ===================================================== */

const menuBtn =
    document.getElementById(
        "menuBtn"
    );


const nav =
    document.getElementById(
        "nav"
    );


if (
    menuBtn &&
    nav
) {


    menuBtn.addEventListener(

        "click",

        () => {


            const open =

                nav.classList.toggle(
                    "active"
                );


            menuBtn.setAttribute(

                "aria-expanded",

                open
                    ? "true"
                    : "false"

            );

        }

    );


}


/* =====================================================
   START
   ===================================================== */

loadMatches();


</script>
