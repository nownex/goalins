name: GOALINS - Update Highlights

on:
  workflow_dispatch:
  schedule:
    - cron: "30 * * * *"

permissions:
  contents: write

jobs:

  update-highlights:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          pip install requests

      - name: Update highlights
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/update_highlights.py

      - name: Commit highlights
        run: |

          git config user.name "GOALINS Bot"
          git config user.email "goalins-bot@users.noreply.github.com"

          git add data/highlights.json

          if git diff --cached --quiet; then
            echo "No highlight changes."
            exit 0
          fi

          git commit -m "Update football highlights"
          git push
