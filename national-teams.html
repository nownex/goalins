<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المنتخبات | GOALINS</title>

    <meta name="description"
          content="مباريات المنتخبات الوطنية القادمة والنتائج">

    <link rel="stylesheet" href="style.css">

    <style>

        .national-page {
            min-height: calc(100vh - 80px);
            padding: 40px 0 70px;
        }

        .page-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 25px;
        }

        .page-head small {
            color: var(--accent);
            font-weight: 800;
        }

        .page-head h1 {
            margin: 6px 0;
            font-size: 32px;
        }

        .page-head p {
            color: var(--muted);
            font-size: 14px;
        }

        .back-link {
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
        }

        /* DATE */

        .date-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        .date-btn {
            padding: 14px 10px;
            border-radius: 13px;
            border: 1px solid var(--border);
            background: var(--card);
            color: white;
            font-family: inherit;
            cursor: pointer;
        }

        .date-btn strong {
            display: block;
        }

        .date-btn small {
            color: var(--muted);
        }

        .date-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(37,211,102,.10);
        }

        /* DATE PICKER */

        .date-picker {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .date-picker label {
            color: var(--muted);
            font-size: 13px;
        }

        .date-picker input {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--card);
            color: white;
            font-family: inherit;
        }

        /* FILTER */

        .filter-box {
            margin-bottom: 25px;
        }

        .filter-box label {
            display: block;
            color: var(--muted);
            margin-bottom: 7px;
            font-size: 13px;
        }

        .filter-box select {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card);
            color: white;
            font-family: inherit;
        }

        /* INFO */

        .results-info {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            margin-bottom: 14px;
            font-size: 13px;
        }

        .results-info strong {
            color: white;
        }

        /* MATCHES */

        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .league-box {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--card);
        }

        .league-head {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
        }

        .league-head img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .league-head strong {
            font-size: 13px;
        }

        .match {
            display: grid;
            grid-template-columns: 1fr 90px 1fr;
            align-items: center;
            min-height: 105px;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
        }

        .match:last-child {
            border-bottom: 0;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 13px;
            font-weight: 800;
        }

        .team.home {
            justify-content: flex-end;
            text-align: right;
        }

        .team.away {
            text-align: left;
        }

        .team img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .center {
            text-align: center;
        }

        .time {
            color: var(--accent);
            font-weight: 900;
        }

        .score {
            font-size: 18px;
            font-weight: 900;
        }

        .status {
            margin-top: 3px;
            color: var(--muted);
            font-size: 10px;
        }

        .live {
            color: #ff5364;
        }

        /* STATE */

        .state {
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            border: 1px dashed rgba(255,255,255,.13);
            border-radius: 18px;
            padding: 30px;
        }

        .state-icon {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .state h2 {
            margin-bottom: 7px;
        }

        .state p {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.8;
        }

        .loader {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,.1);
            border-top-color: var(--accent);
            animation: spin .8s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media(max-width:650px) {

            .national-page {
                padding: 30px 0 60px;
            }

            .page-head {
                align-items: flex-start;
                flex-direction: column;
            }

            .page-head h1 {
                font-size: 28px;
            }

            .date-buttons {
                gap: 7px;
            }

            .date-btn {
                padding: 12px 5px;
                font-size: 12px;
            }

            .match {
                grid-template-columns: 1fr 60px 1fr;
                padding: 10px 7px;
            }

            .team {
                font-size: 10px;
                gap: 5px;
            }

            .team img {
                width: 32px;
                height: 32px;
            }

            .time {
                font-size: 12px;
            }

            .score {
                font-size: 16px;
            }
        }

    </style>
</head>


<body>


<header class="header">

    <div class="container header-inner">

        <a href="index.html" class="logo">
            <span>GOAL</span>INS
        </a>

        <button
            class="menu-btn"
            id="menuBtn"
            aria-label="القائمة">

            ☰

        </button>

        <nav id="nav">

            <a href="matches.html">المباريات</a>

            <a href="national-teams.html">المنتخبات</a>

            <a href="highlights.html">الملخصات</a>

            <a href="goals.html">الأهداف</a>

        </nav>

    </div>

</header>



<main class="national-page">

    <div class="container">


        <div class="page-head">

            <div>

                <small>GOALINS FOOTBALL</small>

                <h1>مباريات المنتخبات</h1>

                <p>
                    تابع أهم مباريات المنتخبات الوطنية.
                </p>

            </div>

            <a href="index.html" class="back-link">
                ← الرئيسية
            </a>

        </div>



        <!-- DATE BUTTONS -->

        <div class="date-buttons">

            <button class="date-btn active" data-offset="0">

                <strong>اليوم</strong>

                <small>مباريات اليوم</small>

            </button>


            <button class="date-btn" data-offset="1">

                <strong>غدًا</strong>

                <small>غدًا</small>

            </button>


            <button class="date-btn" data-offset="2">

                <strong>بعد غد</strong>

                <small>المباريات القادمة</small>

            </button>

        </div>



        <!-- CUSTOM DATE -->

        <div class="date-picker">

            <label for="date">
                تاريخ:
            </label>

            <input
                type="date"
                id="date">

        </div>



        <!-- COMPETITION -->

        <div class="filter-box">

            <label for="competition">
                البطولة
            </label>

            <select id="competition">

                <option value="all">
                    جميع المنافسات
                </option>

                <option value="world">
                    كأس العالم
                </option>

                <option value="world-qualifiers">
                    تصفيات كأس العالم
                </option>

                <option value="euro">
                    كأس أمم أوروبا
                </option>

                <option value="afcon">
                    كأس أمم أفريقيا
                </option>

                <option value="nations">
                    دوري الأمم
                </option>

                <option value="copa">
                    كوبا أمريكا
                </option>

                <option value="asian">
                    كأس آسيا
                </option>

                <option value="friendly">
                    مباريات ودية
                </option>

            </select>

        </div>



        <div class="results-info">

            <span id="dateText">
                مباريات المنتخبات اليوم
            </span>

            <span>
                <strong id="count">0</strong>
                مباراة
            </span>

        </div>



        <div
            class="matches-list"
            id="matchesList">

            <div class="state">

                <div class="loader"></div>

                <h2>
                    جاري تحميل المباريات
                </h2>

                <p>
                    لحظات من فضلك...
                </p>

            </div>

        </div>

    </div>

</main>



<script>

/* =====================================================
   GOALINS — NATIONAL TEAMS
   ===================================================== */


const list =
    document.getElementById("matchesList");

const count =
    document.getElementById("count");

const dateText =
    document.getElementById("dateText");

const dateInput =
    document.getElementById("date");

const competition =
    document.getElementById("competition");

const dateButtons =
    document.querySelectorAll(".date-btn");


let matches = [];

let selectedDate =
    localDate(0);

let selectedCompetition =
    "all";


/* =====================================================
   LOCAL DATE
   ===================================================== */

function localDate(offset = 0) {

    const d = new Date();

    d.setDate(
        d.getDate() + offset
    );

    const year =
        d.getFullYear();

    const month =
        String(d.getMonth() + 1)
        .padStart(2, "0");

    const day =
        String(d.getDate())
        .padStart(2, "0");

    return `${year}-${month}-${day}`;

}


/* =====================================================
   LOAD JSON
   ===================================================== */

async function loadMatches() {

    try {

        const url =
            new URL(
                "data/matches.json",
                document.baseURI
            ).href;


        const controller =
            new AbortController();


        const timeout =
            setTimeout(
                () => controller.abort(),
                15000
            );


        const response =
            await fetch(
                url + "?v=" + Date.now(),
                {
                    cache: "no-store",
                    signal: controller.signal
                }
            );


        clearTimeout(timeout);


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
         * ندعم أكثر من شكل للـJSON
         */

        if (Array.isArray(data)) {

            matches = data;

        } else if (
            Array.isArray(data.matches)
        ) {

            matches = data.matches;

        } else if (
            Array.isArray(data.response)
        ) {

            matches = data.response;

        } else {

            matches = [];

        }


        console.log(
            "GOALINS matches:",
            matches.length
        );


        render();


    } catch (error) {

        console.error(
            "GOALINS ERROR:",
            error
        );


        list.innerHTML = `

            <div class="state">

                <div class="state-icon">
                    ⚠️
                </div>

                <h2>
                    تعذر تحميل المباريات
                </h2>

                <p>
                    لم تتمكن الصفحة من قراءة
                    ملف المباريات.
                    <br>
                    تحقق من وجود:
                    <br>
                    <b>data/matches.json</b>
                </p>

            </div>

        `;

    }

}


/* =====================================================
   GET DATE
   ===================================================== */

function matchDate(match) {

    return String(
        match.date ||
        match.fixture?.date ||
        ""
    ).substring(0, 10);

}


/* =====================================================
   GET LEAGUE
   ===================================================== */

function league(match) {

    return (
        match.league ||
        match.competition ||
        {}
    );

}


/* =====================================================
   NATIONAL COMPETITIONS
   ===================================================== */

function isNational(match) {

    const l =
        league(match);

    const name =
        String(
            l.name || ""
        ).toLowerCase();


    /*
     * مسابقات المنتخبات
     */

    const terms = [

        "world cup",
        "world cup qualification",
        "world cup qualifiers",

        "euro",
        "european championship",

        "africa cup of nations",
        "afcon",

        "nations league",

        "copa america",

        "asian cup",

        "afc asian cup",

        "gold cup",

        "concacaf",

        "international friendly",
        "friendlies"

    ];


    return terms.some(
        term =>
            name.includes(term)
    );

}


/* =====================================================
   COMPETITION FILTER
   ===================================================== */

function competitionOK(match) {

    if (
        selectedCompetition ===
        "all"
    ) {

        return true;

    }


    const name =
        String(
            league(match).name || ""
        ).toLowerCase();


    const map = {

        world: [
            "world cup"
        ],

        "world-qualifiers": [
            "world cup qualification",
            "world cup qualifiers"
        ],

        euro: [
            "euro",
            "european championship"
        ],

        afcon: [
            "africa cup of nations",
            "afcon"
        ],

        nations: [
            "nations league"
        ],

        copa: [
            "copa america"
        ],

        asian: [
            "asian cup",
            "afc asian"
        ],

        friendly: [
            "friendly",
            "friendlies"
        ]

    };


    return (
        map[selectedCompetition] || []
    ).some(
        term =>
            name.includes(term)
    );

}


/* =====================================================
   TEAM DATA
   ===================================================== */

function homeTeam(match) {

    return (
        match.home ||
        match.teams?.home ||
        {}
    );

}


function awayTeam(match) {

    return (
        match.away ||
        match.teams?.away ||
        {}
    );

}


/* =====================================================
   SCORE
   ===================================================== */

function goalsHome(match) {

    return (
        match.goals?.home ??
        match.score?.fulltime?.home ??
        "-"
    );

}


function goalsAway(match) {

    return (
        match.goals?.away ??
        match.score?.fulltime?.away ??
        "-"
    );

}


/* =====================================================
   STATUS
   ===================================================== */

function matchStatus(match) {

    return String(
        match.status ||
        match.fixture?.status?.short ||
        ""
    );

}


/* =====================================================
   TIME
   ===================================================== */

function matchTime(match) {

    const value =
        match.date ||
        match.fixture?.date;


    if (!value) {
        return "--:--";
    }


    const d =
        new Date(value);


    return d.toLocaleTimeString(
        "ar-DZ",
        {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        }
    );

}


/* =====================================================
   RENDER
   ===================================================== */

function render() {

    let filtered =
        matches.filter(
            match =>
                matchDate(match) ===
                selectedDate
        );


    filtered =
        filtered.filter(
            match =>
                isNational(match)
        );


    filtered =
        filtered.filter(
            match =>
                competitionOK(match)
        );


    filtered.sort(
        (a, b) =>
            Number(
                a.timestamp ||
                a.fixture?.timestamp ||
                0
            ) -
            Number(
                b.timestamp ||
                b.fixture?.timestamp ||
                0
            )
    );


    count.textContent =
        filtered.length;


    dateText.textContent =
        "مباريات المنتخبات " +
        formatDate(selectedDate);


    if (!filtered.length) {

        list.innerHTML = `

            <div class="state">

                <div class="state-icon">
                    🌍
                </div>

                <h2>
                    لا توجد مباريات
                </h2>

                <p>
                    لا توجد مباريات منتخبات
                    في التاريخ أو البطولة
                    المحددة حاليًا.
                </p>

            </div>

        `;

        return;

    }


    /*
     * تجميع حسب البطولة
     */

    const groups = {};


    filtered.forEach(match => {

        const l =
            league(match);

        const key =
            l.id ||
            l.name ||
            "other";


        if (!groups[key]) {

            groups[key] = {
                league: l,
                matches: []
            };

        }


        groups[key]
            .matches
            .push(match);

    });


    list.innerHTML =
        Object.values(groups)
        .map(group =>
            createLeague(group)
        )
        .join("");

}


/* =====================================================
   LEAGUE
   ===================================================== */

function createLeague(group) {

    const l =
        group.league || {};


    const logo =
        l.logo
        ? `
            <img
                src="${safeURL(l.logo)}"
                alt="">
        `
        : "";


    return `

        <section class="league-box">

            <div class="league-head">

                ${logo}

                <strong>
                    ${escapeHTML(
                        l.name ||
                        "منافسة دولية"
                    )}
                </strong>

            </div>


            ${group.matches
                .map(createMatch)
                .join("")}

        </section>

    `;

}


/* =====================================================
   MATCH CARD
   ===================================================== */

function createMatch(match) {

    const home =
        homeTeam(match);

    const away =
        awayTeam(match);


    const status =
        matchStatus(match);


    const live = [
        "1H",
        "2H",
        "HT",
        "ET",
        "P",
        "LIVE"
    ].includes(status);


    const finished = [
        "FT",
        "AET",
        "PEN"
    ].includes(status);


    let center;


    if (finished) {

        center = `

            <div class="score">
                ${goalsHome(match)}
                -
                ${goalsAway(match)}
            </div>

            <div class="status">
                انتهت
            </div>

        `;

    } else if (live) {

        center = `

            <div class="score live">
                🔴
                ${goalsHome(match)}
                -
                ${goalsAway(match)}
            </div>

            <div class="status live">
                مباشر
            </div>

        `;

    } else {

        center = `

            <div class="time">
                ${matchTime(match)}
            </div>

            <div class="status">
                لم تبدأ
            </div>

        `;

    }


    return `

        <div class="match">


            <div class="team home">

                <span>
                    ${escapeHTML(
                        home.name ||
                        "المنتخب"
                    )}
                </span>

                ${
                    home.logo
                    ? `
                        <img
                            src="${safeURL(
                                home.logo
                            )}"
                            alt=""
                            loading="lazy">
                    `
                    : ""
                }

            </div>


            <div class="center">

                ${center}

            </div>


            <div class="team away">

                ${
                    away.logo
                    ? `
                        <img
                            src="${safeURL(
                                away.logo
                            )}"
                            alt=""
                            loading="lazy">
                    `
                    : ""
                }

                <span>
                    ${escapeHTML(
                        away.name ||
                        "المنتخب"
                    )}
                </span>

            </div>


        </div>

    `;

}


/* =====================================================
   DATE FORMAT
   ===================================================== */

function formatDate(value) {

    const d =
        new Date(
            value + "T12:00:00"
        );


    return d.toLocaleDateString(
        "ar-DZ",
        {
            day: "numeric",
            month: "long"
        }
    );

}


/* =====================================================
   SAFE URL
   ===================================================== */

function safeURL(url) {

    try {

        const u =
            new URL(
                url,
                document.baseURI
            );


        if (
            u.protocol !== "http:" &&
            u.protocol !== "https:"
        ) {

            return "";

        }


        return u.href;

    } catch {

        return "";

    }

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value) {

    return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

}


/* =====================================================
   DATE BUTTONS
   ===================================================== */

dateButtons.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            dateButtons.forEach(
                b =>
                    b.classList.remove(
                        "active"
                    )
            );


            button.classList.add(
                "active"
            );


            selectedDate =
                localDate(
                    Number(
                        button.dataset.offset
                    )
                );


            dateInput.value = "";


            render();

        }
    );

});


/* =====================================================
   CUSTOM DATE
   ===================================================== */

dateInput.addEventListener(
    "change",
    () => {

        if (!dateInput.value) {
            return;
        }


        dateButtons.forEach(
            b =>
                b.classList.remove(
                    "active"
                )
        );


        selectedDate =
            dateInput.value;


        render();

    }
);


/* =====================================================
   COMPETITION
   ===================================================== */

competition.addEventListener(
    "change",
    () => {

        selectedCompetition =
            competition.value;


        render();

    }
);


/* =====================================================
   MOBILE MENU
   ===================================================== */

const menuBtn =
    document.getElementById("menuBtn");

const nav =
    document.getElementById("nav");


if (menuBtn && nav) {

    menuBtn.addEventListener(
        "click",
        () => {

            nav.classList.toggle(
                "active"
            );

        }
    );

}


/* =====================================================
   START
   ===================================================== */

loadMatches();

</script>

</body>
</html>
