<style>

/* =====================================================
   GOALINS HIGHLIGHTS PAGE
   ===================================================== */

.highlights-page {

    min-height:
        calc(100vh - 80px);

    padding:
        35px 0 70px;

    font-family:
        "Cairo",
        Arial,
        sans-serif;

}


/* =====================================================
   PAGE TITLE
   ===================================================== */

.page-title {

    margin-bottom:
        25px;

}


.page-title small {

    color:
        var(--accent);

    font-weight:
        900;

    letter-spacing:
        .5px;

}


.page-title h1 {

    margin:
        6px 0;

    font-size:
        32px;

    font-weight:
        900;

    line-height:
        1.5;

}


.page-title p {

    margin:
        0;

    color:
        var(--muted);

    font-size:
        14px;

    font-weight:
        500;

}


/* =====================================================
   FILTERS
   ===================================================== */

.filters {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        12px;

    margin-bottom:
        25px;

}


.filter {

    width:
        100%;

    min-height:
        52px;

    padding:
        12px 15px;

    border:
        1px solid var(--border);

    border-radius:
        14px;

    background:
        var(--card);

    color:
        white;

    font-family:
        "Cairo",
        Arial,
        sans-serif;

    font-size:
        14px;

    font-weight:
        700;

    outline:
        none;

    cursor:
        pointer;

    transition:
        .2s ease;

}


.filter:hover {

    border-color:
        rgba(37,211,102,.55);

}


.filter:focus {

    border-color:
        var(--accent);

    box-shadow:
        0 0 0 3px
        rgba(37,211,102,.10);

}


.filter option {

    background:
        #07111f;

    color:
        white;

    font-family:
        "Cairo",
        Arial,
        sans-serif;

}


/* =====================================================
   SECTION HEADER
   ===================================================== */

.section-header {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    margin-bottom:
        15px;

}


.section-header h2 {

    margin:
        0;

    font-size:
        21px;

    font-weight:
        900;

}


.section-header span {

    color:
        var(--muted);

    font-size:
        12px;

    font-weight:
        600;

}


/* =====================================================
   VIDEO GRID
   ===================================================== */

.video-grid {

    display:
        grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap:
        16px;

}


.video-card {

    overflow:
        hidden;

    background:
        var(--card);

    border:
        1px solid var(--border);

    border-radius:
        17px;

    cursor:
        pointer;

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;

}


.video-card:hover {

    transform:
        translateY(-3px);

    border-color:
        rgba(37,211,102,.45);

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.20);

}


/* =====================================================
   THUMBNAIL
   ===================================================== */

.thumbnail {

    position:
        relative;

    aspect-ratio:
        16 / 9;

    background:
        #0b1b2e;

    overflow:
        hidden;

}


.thumbnail img {

    width:
        100%;

    height:
        100%;

    object-fit:
        cover;

    display:
        block;

    transition:
        transform .3s ease;

}


.video-card:hover
.thumbnail img {

    transform:
        scale(1.025);

}


/* =====================================================
   PLAY BUTTON
   ===================================================== */

.play {

    position:
        absolute;

    top:
        50%;

    left:
        50%;

    transform:
        translate(-50%, -50%);

    width:
        58px;

    height:
        58px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        50%;

    background:
        rgba(37,211,102,.95);

    color:
        #06121f;

    font-size:
        23px;

    font-weight:
        900;

    box-shadow:
        0 5px 25px
        rgba(0,0,0,.4);

    transition:
        transform .2s ease,
        background .2s ease;

}


.video-card:hover .play {

    transform:
        translate(-50%, -50%)
        scale(1.08);

}


/* =====================================================
   CARD CONTENT
   ===================================================== */

.video-content {

    padding:
        14px;

}


.video-title {

    margin:
        0 0 10px;

    font-size:
        15px;

    line-height:
        1.8;

    font-weight:
        800;

    color:
        #fff;

}


.video-meta {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        10px;

    color:
        var(--muted);

    font-size:
        11px;

    font-weight:
        500;

}


.video-league {

    color:
        var(--accent);

    font-weight:
        700;

}


.video-source {

    margin-top:
        9px;

    color:
        var(--muted);

    font-size:
        11px;

    font-weight:
        500;

}


/* =====================================================
   STATES
   ===================================================== */

.state {

    min-height:
        280px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    flex-direction:
        column;

    text-align:
        center;

    border:
        1px dashed
        rgba(255,255,255,.13);

    border-radius:
        18px;

    padding:
        30px;

    grid-column:
        1 / -1;

}


.state-icon {

    font-size:
        40px;

    margin-bottom:
        12px;

}


.state h2 {

    margin:
        0 0 8px;

    font-weight:
        800;

}


.state p {

    margin:
        0;

    color:
        var(--muted);

    font-size:
        13px;

    line-height:
        1.8;

}


/* =====================================================
   LOADER
   ===================================================== */

.loader {

    width:
        38px;

    height:
        38px;

    border-radius:
        50%;

    border:
        3px solid
        rgba(255,255,255,.10);

    border-top-color:
        var(--accent);

    animation:
        spin .8s linear infinite;

    margin-bottom:
        15px;

}


@keyframes spin {

    to {

        transform:
            rotate(360deg);

    }

}


/* =====================================================
   YOUTUBE NOTE
   ===================================================== */

.youtube-note {

    margin-top:
        20px;

    padding:
        14px 16px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:
        14px;

    background:
        rgba(255,255,255,.025);

    color:
        var(--muted);

    font-size:
        12px;

    line-height:
        1.9;

    text-align:
        center;

}


.youtube-note strong {

        white;

}


/* =====================================================
   MOBILE

@media(max-width:650px) {

        padding:

    .page-title h1 {

    }

        grid-template-columns:

    }


    .video-title {

}


/* =====================================================

<!-- =====================================================

     ===================================================== -->

<script>


/* =====================================================
   ELEMENTS
   ===================================================== */

const videoGrid =
    document.getElementById(
        "videoGrid"
    );


const videoCount =
    document.getElementById(
        "videoCount"
    );


const dateFilter =
    document.getElementById(
        "dateFilter"
    );


const leagueFilter =
    document.getElementById(
        "leagueFilter"
    );


let videos = [];



/* =====================================================
   ARABIC LEAGUE NAMES
   ===================================================== */

const leagueNames = {

    "premier league":
        "🇬🇧 الدوري الإنجليزي",

    "la liga":
        "🇪🇸 الدوري الإسباني",

    "ligue 1":
        "🇫🇷 الدوري الفرنسي",

    "serie a":
        "🇮🇹 الدوري الإيطالي",

    "eredivisie":
        "🇳🇱 الدوري الهولندي",

    "jupiler pro league":
        "🇧🇪 الدوري البلجيكي",

    "primeira liga":
        "🇵🇹 الدوري البرتغالي",

    "bundesliga":
        "🇩🇪 الدوري الألماني",

    "uefa champions league":
        "🏆 دوري أبطال أوروبا",

    "champions league":
        "🏆 دوري أبطال أوروبا",

    "uefa europa league":
        "🏆 الدوري الأوروبي",

    "europa league":
        "🏆 الدوري الأوروبي",

    "uefa europa conference league":
        "🏆 دوري المؤتمر الأوروبي",

    "europa conference league":
        "🏆 دوري المؤتمر الأوروبي",

    "uefa europa conference league qualification":
        "🏆 تصفيات دوري المؤتمر الأوروبي",

    "uefa champions league qualification":
        "🏆 تصفيات دوري أبطال أوروبا",

    "uefa europa league qualification":
        "🏆 تصفيات الدوري الأوروبي"

};



/* =====================================================
   NORMALIZE LEAGUE
   ===================================================== */

function normalizeLeague(
    league
) {

    return String(
        league || ""
    )
    .toLowerCase()
    .trim()
    .replace(
        /\s+/g,
        " "
    );

}



/* =====================================================
   GET LEAGUE LABEL
   ===================================================== */

function getLeagueLabel(
    league
) {

    const normalized =
        normalizeLeague(
            league
        );


    if (
        leagueNames[
            normalized
        ]
    ) {

        return leagueNames[
            normalized
        ];

    }


    /*
     * إذا كانت البطولة جديدة
     * وليست في القائمة،
     * نعرض اسمها كما جاء من JSON.
     */

    return String(
        league || "بطولة"
    );

}



/* =====================================================
   BUILD LEAGUE FILTER
   ===================================================== */

function buildLeagueFilter() {

    /*
     * استخراج البطولات الموجودة فعليًا
     * داخل highlights.json.
     */

    const leagues =
        new Map();


    videos.forEach(
        video => {

            const original =
                String(
                    video.league || ""
                ).trim();


            if (!original) {

                return;

            }


            const key =
                normalizeLeague(
                    original
                );


            if (!leagues.has(key)) {

                leagues.set(
                    key,
                    original
                );

            }

        }
    );


    /*
     * ترتيب البطولات أبجديًا.
     */

    const sorted =
        Array.from(
            leagues.entries()
        )
        .sort(
            (
                a,
                b
            ) =>
                a[1].localeCompare(
                    b[1],
                    "ar"
                )
        );


    /*
     * إعادة بناء القائمة.
     */

    leagueFilter.innerHTML = `

        <option value="all">
            جميع البطولات
        </option>

    `;


    sorted.forEach(
        (
            [key, original]
        ) => {

            const option =
                document.createElement(
                    "option"
                );


            /*
             * قيمة الفلتر = الاسم
             * الموحد للبطولة.
             */

            option.value =
                key;


            option.textContent =
                getLeagueLabel(
                    original
                );


            leagueFilter.appendChild(
                option
            );

        }
    );

}



/* =====================================================
   LOAD DATA
   ===================================================== */

async function loadVideos() {

    try {

        const response =
            await fetch(
                "data/highlights.json?v="
                +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Could not load highlights.json"
            );

        }


        const data =
            await response.json();


        videos =
            Array.isArray(
                data.highlights
            )
            ?
            data.highlights
            :
            [];


        /*
         * بناء فلتر البطولات
         * من البيانات الحقيقية.
         */

        buildLeagueFilter();


        renderVideos();

    }

    catch (error) {

        console.error(
            error
        );


        videoCount.textContent =
            "0 فيديو";


        videoGrid.innerHTML = `

            <div class="state">

                <div class="state-icon">
                    ⚠️
                </div>

                <h2>
                    تعذر تحميل الملخصات
                </h2>

                <p>
                    حاول تحديث الصفحة بعد قليل.
                </p>

            </div>

        `;

    }

}



/* =====================================================
   ALGERIA DATE
   ===================================================== */

function getAlgeriaDate(
    offsetDays = 0
) {

    /*
     * نعتمد توقيت الجزائر بدل UTC
     * حتى لا يحدث اختلاف في اليوم.
     */

    const now =
        new Date();


    const parts =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone:
                    "Africa/Algiers",

                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit"
            }
        )
        .formatToParts(
            now
        );


    let year = "";
    let month = "";
    let day = "";


    parts.forEach(
        part => {

            if (
                part.type ===
                "year"
            ) {

                year =
                    part.value;

            }


            if (
                part.type ===
                "month"
            ) {

                month =
                    part.value;

            }


            if (
                part.type ===
                "day"
            ) {

                day =
                    part.value;

            }

        }
    );


    const date =
        new Date(
            `${year}-${month}-${day}T12:00:00`
        );


    date.setDate(
        date.getDate()
        +
        offsetDays
    );


    return date
        .toISOString()
        .slice(
            0,
            10
        );

}



function getToday() {

    return getAlgeriaDate(
        0
    );

}



function getYesterday() {

    return getAlgeriaDate(
        -1
    );

}



/* =====================================================
   LEAGUE FILTER MATCH
   ===================================================== */

function leagueMatches(
    videoLeague,
    selectedLeague
) {

    if (
        selectedLeague ===
        "all"
    ) {

        return true;

    }


    return (
        normalizeLeague(
            videoLeague
        )
        ===
        selectedLeague
    );

}



/* =====================================================
   FILTER
   ===================================================== */

function getFilteredVideos() {

    const dateValue =
        dateFilter.value;


    const leagueValue =
        leagueFilter.value;


    return videos.filter(
        video => {


            /* =========================================
               DATE
               ========================================= */

            if (
                dateValue ===
                "today"
            ) {

                if (
                    String(
                        video.date || ""
                    ).slice(
                        0,
                        10
                    )
                    !==
                    getToday()
                ) {

                    return false;

                }

            }


            if (
                dateValue ===
                "yesterday"
            ) {

                if (
                    String(
                        video.date || ""
                    ).slice(
                        0,
                        10
                    )
                    !==
                    getYesterday()
                ) {

                    return false;

                }

            }


            /* =========================================
               LEAGUE
               ========================================= */

            if (
                !leagueMatches(
                    video.league,
                    leagueValue
                )
            ) {

                return false;

            }


            return true;

        }
    );

}



/* =====================================================
   RENDER
   ===================================================== */

function renderVideos() {

    const filtered =
        getFilteredVideos();


    videoCount.textContent =
        filtered.length
        +
        " فيديو";


    if (
        filtered.length === 0
    ) {

        videoGrid.innerHTML = `

            <div class="state">

                <div class="state-icon">
                    🎬
                </div>

                <h2>
                    لا توجد ملخصات
                </h2>

                <p>
                    لا توجد فيديوهات مطابقة
                    للفلاتر الحالية.
                </p>

            </div>

        `;

        return;

    }



    videoGrid.innerHTML =
        filtered
            .map(
                (
                    video,
                    index
                ) =>

                    createVideoCard(
                        video,
                        index
                    )

            )
            .join("");



    /*
     * ربط الضغط بالبطاقات.
     */

    document
        .querySelectorAll(
            ".video-card"
        )
        .forEach(
            (
                card,
                index
            ) => {

                card.addEventListener(
                    "click",
                    () => {

                        openVideo(
                            filtered[index]
                        );

                    }
                );

            }
        );

}



/* =====================================================
   VIDEO CARD
   ===================================================== */

function createVideoCard(
    video,
    index
) {


    const rawTitle =
        video.title
        ||
        (
            String(
                video.home || ""
            )
            +
            " vs "
            +
            String(
                video.away || ""
            )
        );


    const title =
        escapeHtml(
            rawTitle
        );


    const thumbnail =
        video.thumbnail
        ||
        "";


    const league =
        escapeHtml(
            getLeagueLabel(
                video.league
            )
        );


    const date =
        escapeHtml(
            String(
                video.date || ""
            ).slice(
                0,
                10
            )
        );


    const source =
        escapeHtml(
            video.source
            ||
            "YouTube"
        );



    return `

        <article
            class="video-card"
            data-index="${index}">


            <div
                class="thumbnail">


                ${
                    thumbnail
                    ?

                    `

                    <img
                        src="${escapeAttribute(thumbnail)}"
                        alt="${title}"
                        loading="lazy"
                        onerror="this.style.display='none';">

                    `

                    :

                    `

                    <div
                        style="
                        width:100%;
                        height:100%;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-size:50px;
                        ">

                        ⚽

                    </div>

                    `
                }



                <div class="play">
                    ▶
                </div>


            </div>



            <div
                class="video-content">


                <h3
                    class="video-title">

                    ${title}

                </h3>



                <div
                    class="video-meta">


                    <span
                        class="video-league">

                        ${league}

                    </span>


                    <span>

                        ${date}

                    </span>


                </div>



                <div
                    class="video-source">

                    المصدر:
                    ${source}

                </div>


            </div>


        </article>

    `;

}



/* =====================================================
   OPEN VIDEO — YOUTUBE DIRECT
   ===================================================== */

function openVideo(
    video
) {


    let youtubeUrl =
        String(
            video.url || ""
        ).trim();



    /*
     * الطريقة الأولى:
     * youtube_id
     */

    if (
        !youtubeUrl
        &&
        video.youtube_id
    ) {

        youtubeUrl =
            "https://www.youtube.com/watch?v="
            +
            encodeURIComponent(
                video.youtube_id
            );

    }



    /*
     * الطريقة الثانية:
     * embed_url
     */

    if (
        !youtubeUrl
        &&
        video.embed_url
    ) {

        const match =
            String(
                video.embed_url
            )
            .match(
                /embed\/([^?&#/]+)/
            );


        if (match) {

            youtubeUrl =
                "https://www.youtube.com/watch?v="
                +
                encodeURIComponent(
                    match[1]
                );

        }

    }



    /*
     * الطريقة الثالثة:
     * embed
     */

    if (
        !youtubeUrl
        &&
        video.embed
    ) {

        const match =
            String(
                video.embed
            )
            .match(
                /embed\/([^?&#/]+)/
            );


        if (match) {

            youtubeUrl =
                "https://www.youtube.com/watch?v="
                +
                encodeURIComponent(
                    match[1]
                );

        }

    }



    /*
     * لا يوجد فيديو.
     */

    if (!youtubeUrl) {

        console.warn(
            "No YouTube URL available:",
            video
        );

        return;

    }



    /*
     * فتح الفيديو الأصلي على YouTube.
     */

    window.location.href =
        youtubeUrl;

}



/* =====================================================
   FILTER EVENTS
   ===================================================== */

dateFilter.addEventListener(
    "change",
    renderVideos
);


leagueFilter.addEventListener(
    "change",
    renderVideos
);



/* =====================================================
   MOBILE MENU
   ===================================================== */

const menuBtn =
    document.getElementById(
        "menuBtn"
    );


const nav =
    document.getElementById(
        "nav"
    );


if (
    menuBtn
    &&
    nav
) {

    menuBtn.addEventListener(
        "click",
        () => {


            const open =
                nav.classList.toggle(
                    "active"
                );


            menuBtn.setAttribute(
                "aria-expanded",
                open
                ?
                "true"
                :
                "false"
            );


        }
    );

}



/* =====================================================
   SECURITY
   ===================================================== */

function escapeHtml(
    value
) {

    return String(
        value || ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}



function escapeAttribute(
    value
) {

    return escapeHtml(
        value
    );

}

loadVideos();
