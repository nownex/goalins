name: GOALINS - Update Matches

on:

  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"


permissions:
  contents: write


jobs:

  update-matches:

    runs-on: ubuntu-latest


    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # FETCH FOOTBALL MATCHES
      # =====================================================

      - name: Fetch football matches

        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

        run: |

          python3 <<'PY'

          import json
          import os
          import time

          from datetime import (
              datetime,
              timedelta,
              timezone
          )

          from urllib.request import (
              Request,
              urlopen
          )

          from urllib.parse import (
              urlencode
          )


          # =====================================================
          # CONFIG
          # =====================================================

          API_KEY = os.environ.get(
              "API_FOOTBALL_KEY"
          )


          if not API_KEY:

              raise RuntimeError(
                  "API_FOOTBALL_KEY is missing"
              )


          BASE_URL = (
              "https://v3.football.api-sports.io/fixtures"
          )


          TIMEZONE = "Africa/Algiers"


          # =====================================================
          # DATE RANGE
          # =====================================================
          #
          # Previous 7 days
          # +
          # Today
          # +
          # Next 7 days
          #
          # This is required by the Highlights engine.
          # =====================================================

          DAYS_BEFORE = 7
          DAYS_AFTER = 7


          LOCAL_OFFSET = timedelta(
              hours=1
          )


          now_utc = datetime.now(
              timezone.utc
          )


          # =====================================================
          # MATCH STORAGE
          # =====================================================

          matches = []


          # =====================================================
          # FETCH
          # =====================================================

          for day_offset in range(
              -DAYS_BEFORE,
              DAYS_AFTER + 1
          ):


              local_date = (

                  now_utc

                  + LOCAL_OFFSET

                  + timedelta(
                      days=day_offset
                  )

              ).date()


              date_string = (
                  local_date.isoformat()
              )


              print(
                  f"Fetching: {date_string}"
              )


              query = urlencode({

                  "date":
                      date_string,

                  "timezone":
                      TIMEZONE

              })


              url = (
                  f"{BASE_URL}?{query}"
              )


              request = Request(

                  url,

                  headers={

                      "x-apisports-key":
                          API_KEY,

                      "Accept":
                          "application/json"

                  }

              )


              try:

                  with urlopen(
                      request,
                      timeout=30
                  ) as response:

                      data = json.loads(

                          response
                          .read()
                          .decode("utf-8")

                      )


              except Exception as error:

                  print(
                      f"ERROR fetching "
                      f"{date_string}:",
                      error
                  )

                  continue


              # =================================================
              # API ERRORS
              # =================================================

              if data.get("errors"):

                  print(
                      "API errors:",
                      data["errors"]
                  )


              # =================================================
              # READ MATCHES
              # =================================================

              for item in data.get(
                  "response",
                  []
              ):


                  fixture = item.get(
                      "fixture",
                      {}
                  )


                  league = item.get(
                      "league",
                      {}
                  )


                  teams = item.get(
                      "teams",
                      {}
                  )


                  goals = item.get(
                      "goals",
                      {}
                  )


                  status = fixture.get(
                      "status",
                      {}
                  )


                  home = teams.get(
                      "home",
                      {}
                  )


                  away = teams.get(
                      "away",
                      {}
                  )


                  matches.append({

                      "fixture_id":
                          fixture.get("id"),


                      "date":
                          fixture.get("date"),


                      "timestamp":
                          fixture.get("timestamp"),


                      "status":
                          status.get("short"),


                      "status_long":
                          status.get("long"),


                      "elapsed":
                          status.get("elapsed"),


                      "league": {

                          "id":
                              league.get("id"),

                          "name":
                              league.get("name"),

                          "country":
                              league.get("country"),

                          "logo":
                              league.get("logo"),

                          "flag":
                              league.get("flag"),

                          "round":
                              league.get("round")

                      },


                      "home": {

                          "id":
                              home.get("id"),

                          "name":
                              home.get("name"),

                          "logo":
                              home.get("logo"),

                          "winner":
                              home.get("winner")

                      },


                      "away": {

                          "id":
                              away.get("id"),

                          "name":
                              away.get("name"),

                          "logo":
                              away.get("logo"),

                          "winner":
                              away.get("winner")

                      },


                      "goals": {

                          "home":
                              goals.get("home"),

                          "away":
                              goals.get("away")

                      }

                  })


              # =================================================
              # SMALL DELAY
              # =================================================

              time.sleep(1)


          # =====================================================
          # REMOVE DUPLICATES
          # =====================================================

          unique_matches = {}


          for match in matches:

              fixture_id = match.get(
                  "fixture_id"
              )


              if fixture_id:

                  unique_matches[
                      fixture_id
                  ] = match


          matches = list(
              unique_matches.values()
          )


          # =====================================================
          # SORT BY DATE / TIME
          # =====================================================

          matches.sort(

              key=lambda match: (
                  match.get(
                      "timestamp"
                  ) or 0
              )

          )


          # =====================================================
          # DIAGNOSTICS
          # =====================================================

          finished = [

              match

              for match in matches

              if match.get("status")

              in (
                  "FT",
                  "AET",
                  "PEN"
              )

          ]


          print(
              "======================================"
          )


          print(
              "GOALINS MATCHES DIAGNOSTIC"
          )


          print(
              "======================================"
          )


          print(
              f"Total matches: "
              f"{len(matches)}"
          )


          print(
              f"Finished matches: "
              f"{len(finished)}"
          )


          print(
              f"Previous days: "
              f"{DAYS_BEFORE}"
          )


          print(
              "Today: 1"
          )


          print(
              f"Next days: "
              f"{DAYS_AFTER}"
          )


          print(
              "======================================"
          )


          # =====================================================
          # IMPORTANT LEAGUE DIAGNOSTIC
          # =====================================================

          allowed_leagues = {

              39:
                  "Premier League",

              140:
                  "La Liga",

              61:
                  "Ligue 1",

              135:
                  "Serie A",

              88:
                  "Eredivisie",

              144:
                  "Jupiler Pro League",

              94:
                  "Primeira Liga",

              78:
                  "Bundesliga",

              2:
                  "UEFA Champions League",

              3:
                  "UEFA Europa League",

              848:
                  "UEFA Conference League",

              1:
                  "World Cup",

              4:
                  "Euro",

              6:
                  "AFCON",

              9:
                  "Copa America"

          }


          allowed_finished = [

              match

              for match in finished

              if (
                  match
                  .get("league", {})
                  .get("id")
                  in allowed_leagues
              )

          ]


          print(
              f"Finished allowed matches: "
              f"{len(allowed_finished)}"
          )


          print(
              "--------------------------------------"
          )


          print(
              "Recent allowed finished matches:"
          )


          for match in allowed_finished[-30:]:

              league_name = (

                  match
                  .get("league", {})
                  .get("name", "")

              )


              home_name = (

                  match
                  .get("home", {})
                  .get("name", "")

              )


              away_name = (

                  match
                  .get("away", {})
                  .get("name", "")

              )


              status = match.get(
                  "status",
                  ""
              )


              date_value = str(
                  match.get(
                      "date",
                      ""
                  )
              )[:10]


              print(

                  f"  {date_value} | "
                  f"{league_name} | "
                  f"{home_name} vs "
                  f"{away_name} | "
                  f"{status}"

              )


          print(
              "======================================"
          )


          # =====================================================
          # OUTPUT
          # =====================================================

          output = {

              "updated_at":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "timezone":
                  TIMEZONE,

              "days_before":
                  DAYS_BEFORE,

              "days_after":
                  DAYS_AFTER,

              "count":
                  len(matches),

              "matches":
                  matches

          }


          # =====================================================
          # SAVE
          # =====================================================

          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(

              "data/matches.json",

              "w",

              encoding="utf-8"

          ) as file:

              json.dump(

                  output,

                  file,

                  ensure_ascii=False,

                  indent=2

              )


          print(
              f"Saved {len(matches)} matches."
          )


          print(
              f"Saved finished matches: "
              f"{len(finished)}"
          )


          print(
              f"Saved allowed finished matches: "
              f"{len(allowed_finished)}"
          )


          PY


      # =====================================================
      # COMMIT
      # =====================================================

      - name: Commit updated matches

        run: |

          git config user.name "GOALINS Bot"

          git config user.email \
            "actions@users.noreply.github.com"


          git add data/matches.json


          git diff --cached --quiet || \
            git commit \
            -m "Update football matches"


          git push
